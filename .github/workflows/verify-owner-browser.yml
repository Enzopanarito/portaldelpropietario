name: Verify Owner Portal Browser

on:
  pull_request:
    branches: [main]
  workflow_run:
    workflows: ["Deploy Netlify Production"]
    types: [completed]

permissions:
  contents: read
  statuses: write

jobs:
  verify-owner-portal:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'pull_request' && !contains(github.event.pull_request.title, '[skip netlify]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact target commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Resolve target URL
        id: target
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "url=https://deploy-preview-${{ github.event.pull_request.number }}--villalosapamates.netlify.app" >> "$GITHUB_OUTPUT"
          else
            echo "url=https://villalosapamates.netlify.app" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for exact canonical release and breakdown marker
        env:
          TARGET_URL: ${{ steps.target.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          production_release="${RUNNER_TEMP}/owner-browser-release.json"
          for attempt in $(seq 1 90); do
            headers="$(curl --silent --show-error --location --dump-header - --output /dev/null --max-time 30 "${TARGET_URL}/?verify=${GITHUB_RUN_ID}-${attempt}" 2>/dev/null || true)"
            marker="$(printf '%s' "$headers" | awk -F': ' 'tolower($1)=="x-vla-breakdown-presentation"{gsub("\r","");print $2}' | tail -1)"
            if [ "$marker" = "owner-breakdown-v7" ] \
              && curl --fail --silent --show-error --location --max-time 30 "${TARGET_URL}/release.json?verify=${GITHUB_RUN_ID}-${attempt}" --output "$production_release" \
              && node scripts/verify-release-contract.js release.json "$production_release"; then
              echo "Exact browser release available at $TARGET_URL"
              exit 0
            fi
            echo "Attempt $attempt: marker=${marker:-missing}"
            sleep 5
          done
          echo "Exact owner release was not available."
          exit 1

      - name: Install Playwright Chromium
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Verify breakdown and all 15 visible balances
        env:
          TARGET_URL: ${{ steps.target.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          # El alias de Deploy Preview puede cambiar de nodo mientras Edge/HTML/assets
          # terminan de converger. Cada intento abre un navegador nuevo y debe completar
          # TODA la certificación: desglose + 15/15 casas + saldos exactos. No se relaja
          # ninguna aserción financiera; solo se tolera una sesión transitoria fallida.
          for attempt in 1 2 3; do
            echo "OWNER_BROWSER_CERT_ATTEMPT=${attempt}/3"
            rm -f owner-production-result.json owner-production-error.txt owner-production.png
            if node tests/owner-production-browser.cjs; then
              echo "OWNER_BROWSER_CERT_STABLE attempt=${attempt}"
              exit 0
            fi
            echo "OWNER_BROWSER_CERT_TRANSIENT_FAILURE attempt=${attempt}"
            if [ -f owner-production-error.txt ]; then cat owner-production-error.txt; fi
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 2)); fi
          done
          echo "OWNER_BROWSER_CERT_FAILED after 3 complete browser sessions"
          exit 1

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: owner-portal-browser-evidence
          path: |
            owner-production-result.json
            owner-production-error.txt
            owner-production.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish successful production status
        if: success() && github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state=success \
            -f context='Owner Portal Production Verification' \
            -f description='Release exacto, desglose y 15/15 saldos visibles verificados.' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Publish failed production status
        if: failure() && github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state=failure \
            -f context='Owner Portal Production Verification' \
            -f description='La certificación exacta del portal propietario falló.' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
