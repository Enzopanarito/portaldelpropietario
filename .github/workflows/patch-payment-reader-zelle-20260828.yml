name: Patch payment reader Zelle 20260828

on:
  push:
    branches:
      - fix/payment-prefill-quality-fallback-20260828
    paths:
      - .github/workflows/patch-payment-reader-zelle-20260828.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply deterministic patch
        run: python .github/scripts/patch-payment-reader-zelle-20260828.py

      - name: Install dependencies
        run: npm ci

      - name: Run focused unit regressions
        run: node --test tests/payment-proof-prefill.test.js tests/zelle-confirmation-no-reference.test.js

      - name: Commit patch and remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/patch-payment-reader-zelle-20260828.yml
          rm .github/scripts/patch-payment-reader-zelle-20260828.py
          git config user.name 'vla-repair-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Corregir lectura de confirmaciones Zelle sin referencia visible'
          git push origin HEAD:fix/payment-prefill-quality-fallback-20260828
