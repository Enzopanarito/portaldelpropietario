name: House 11 Production Diagnostic

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  diagnose-house-11:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Wait for canonical production shell
        shell: bash
        run: |
          set -euo pipefail
          marker='vla-finance-v7.js'
          for attempt in $(seq 1 36); do
            html="$(curl --fail --silent --show-error --location "https://villalosapamates.netlify.app/?house11-release=${GITHUB_RUN_ID}-${attempt}" || true)"
            if grep -Fq "$marker" <<<"$html"; then
              printf '%s' "$html" > production.html
              echo "Canonical production shell detected."
              exit 0
            fi
            sleep 5
          done
          echo "The canonical production shell was not detected." >&2
          exit 1

      - name: Validate Casa 11 public financial contract
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            "https://villalosapamates.netlify.app/api/vla/public-data?force=1&house11=${GITHUB_RUN_ID}" \
            --output public-data.json
          node <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('public-data.json','utf8'));
          const owners=Array.isArray(data.propietarios)?data.propietarios:[];
          if(owners.length!==15)throw new Error(`La API pública devolvió ${owners.length}/15 casas.`);
          const houses=owners.map(item=>Number(item.Casa));
          if(new Set(houses).size!==15)throw new Error('La API pública contiene casas duplicadas.');
          for(let casa=1;casa<=15;casa++)if(!houses.includes(casa))throw new Error(`Falta Casa ${casa} en la API pública.`);
          const financialFields=[
            'saldoUsd','saldoBsRef','totalPagadero','saldoNetoReferencial',
            'saldoFavorUsd','saldoFavorBs','deudaVencidaUsd','deudaVencidaBs',
            'mesCorrienteUsd','mesCorrienteBs'
          ];
          for(const owner of owners){
            for(const field of financialFields){
              if(!Object.hasOwn(owner,field))throw new Error(`Casa ${owner.Casa}: falta campo canónico ${field}.`);
              if(!Number.isFinite(owner[field]))throw new Error(`Casa ${owner.Casa}: ${field} no es numérico.`);
            }
          }
          const owner=owners.find(item=>Number(item.Casa)===11);
          if(!owner)throw new Error('Casa 11 no aparece en la API pública.');
          const result={
            casa:Number(owner.Casa),
            propietario:String(owner.Propietario||''),
            ...Object.fromEntries(financialFields.map(field=>[field,owner[field]]))
          };
          console.log('PRODUCTION_FINANCIAL_CONTRACT_OK 15/15 houses 150/150 fields');
          console.log('HOUSE11_FINANCIAL_CONTRACT_OK '+JSON.stringify(result));
          NODE

      - name: Check every inline production script
        shell: bash
        run: |
          set -euo pipefail
          test -s production.html
          python3 <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.items=[]
                  self.current=None
              def handle_starttag(self, tag, attrs):
                  if tag.lower()!='script': return
                  meta=dict(attrs)
                  if meta.get('src'): return
                  self.current={'meta':meta,'text':[]}
              def handle_data(self, data):
                  if self.current is not None:
                      self.current['text'].append(data)
              def handle_endtag(self, tag):
                  if tag.lower()=='script' and self.current is not None:
                      self.items.append(self.current)
                      self.current=None

          html=Path('production.html').read_text(encoding='utf-8')
          parser=Scripts(); parser.feed(html)
          out=Path('inline-scripts'); out.mkdir(exist_ok=True)
          manifest=[]
          for i,item in enumerate(parser.items,1):
              path=out/f'{i:03d}.js'
              path.write_text(''.join(item['text']),encoding='utf-8')
              manifest.append(f"{i:03d}\tid={item['meta'].get('id','')}\tbytes={path.stat().st_size}")
          Path('inline-scripts-manifest.txt').write_text('\n'.join(manifest),encoding='utf-8')
          print('\n'.join(manifest))
          PY
          failed=0
          while IFS= read -r file; do
            echo "--- checking ${file} ---"
            if ! node --check "$file"; then
              failed=1
              number="$(basename "$file" .js)"
              grep "^${number}" inline-scripts-manifest.txt || true
              nl -ba "$file" | tail -n 100
            fi
          done < <(find inline-scripts -name '*.js' | sort)
          test "$failed" -eq 0

      - name: Publish successful diagnostic status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context='House 11 Production Diagnostic' \
            -f description='Casa 11 expone contrato financiero válido y scripts sanos.' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Publish failed diagnostic status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context='House 11 Production Diagnostic' \
            -f description='Falló el contrato financiero de Casa 11 o un script de producción.' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
