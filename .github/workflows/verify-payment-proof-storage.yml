name: Verificar almacenamiento de comprobantes

on:
  pull_request:
    paths:
      - '.github/payment-proof-storage-probe-trigger.txt'

permissions:
  contents: read

jobs:
  verify-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probar cifrado, lectura y limpieza
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          status="$(curl --silent --show-error --max-time 45 -o "$tmp" -w '%{http_code}' 'https://villalosapamates.netlify.app/api/vla/internal/payment-proof-storage-probe-20260803?token=E3PV8TwOndstfutuJDbk-8Y983R3EFpQ')"
          response="$(cat "$tmp")"
          rm -f "$tmp"
          echo "HTTP_STATUS=${status}"
          echo "PROBE_RESPONSE=${response}"
          python3 - "$status" "$response" <<'PY'
          import json, sys
          status = int(sys.argv[1])
          data = json.loads(sys.argv[2])
          required = ('ok', 'encryptedWrite', 'decryptedRead', 'cleanup')
          if status != 200 or not all(data.get(key) is True for key in required):
              raise SystemExit(f"Storage probe failed: HTTP {status} {data}")
          print('PAYMENT_PROOF_STORAGE_OK')
          PY
