name: Verify Admin Production

on:
  workflow_run:
    workflows: ["Deploy Netlify Production"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write
  id-token: write

jobs:
  verify-admin-production:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact production commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Wait for Admin quality assets and protection
        shell: bash
        run: |
          set -euo pipefail
          TARGET_URL="https://villalosapamates.netlify.app"
          assets=(admin-premium.css admin-premium-polish.css admin-premium-10.css admin-premium-preflight.js admin-premium.js admin-premium-controls.js admin-premium-10.js admin-feature-parity.js admin-session-bridge.js)
          for attempt in $(seq 1 60); do
            ready=1
            headers="$(curl --silent --show-error --location --dump-header - --output /tmp/admin.html --max-time 20 "${TARGET_URL}/admin.html?verify=${GITHUB_RUN_ID}-${attempt}" 2>/dev/null || true)"
            ui="$(printf '%s' "$headers" | awk -F': ' 'tolower($1)=="x-vla-admin-ui"{gsub("\r","");print $2}' | tail -1)"
            session="$(printf '%s' "$headers" | awk -F': ' 'tolower($1)=="x-vla-admin-session"{gsub("\r","");print $2}' | tail -1)"
            quality="$(printf '%s' "$headers" | awk -F': ' 'tolower($1)=="x-vla-admin-quality"{gsub("\r","");print $2}' | tail -1)"
            [ "$ui" = "premium-v1" ] || ready=0
            [ "$session" = "single-login-v1" ] || ready=0
            [ "$quality" = "10" ] || ready=0
            grep -q 'admin-premium-10.css' /tmp/admin.html 2>/dev/null || ready=0
            grep -q 'admin-premium-10.js' /tmp/admin.html 2>/dev/null || ready=0
            grep -q 'admin-feature-parity.js' /tmp/admin.html 2>/dev/null || ready=0
            for asset in "${assets[@]}"; do
              code="$(curl --silent --show-error --location --output "/tmp/${asset}" --write-out '%{http_code}' --max-time 20 "${TARGET_URL}/${asset}?verify=${GITHUB_RUN_ID}-${attempt}" 2>/dev/null || true)"
              [ "$code" = "200" ] && [ -s "/tmp/${asset}" ] || ready=0
            done
            protected="$(curl --silent --show-error --location --output /tmp/protected.json --write-out '%{http_code}' --max-time 20 "${TARGET_URL}/.netlify/functions/admin-data" 2>/dev/null || true)"
            [ "$protected" = "401" ] || ready=0
            if [ "$ready" = "1" ]; then
              printf '{"assetsVerified":true,"protectedAdminData":true,"ui":"%s","session":"%s","quality":"%s"}\n' "$ui" "$session" "$quality" > admin-production-preflight.json
              echo "Admin quality 10 y protección disponibles."
              exit 0
            fi
            echo "Intento ${attempt}: ui=${ui:-missing} session=${session:-missing} quality=${quality:-missing} protected=${protected:-missing}"
            sleep 5
          done
          echo "Admin quality 10 no estuvo disponible."
          exit 1

      - name: Request short-lived GitHub OIDC identity
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=vla-admin-production-readonly")"
          token="$(printf '%s' "$response" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);process.stdout.write(String(j.value||''))})")"
          if [ -z "$token" ]; then
            echo "GitHub OIDC no devolvió identidad."
            exit 1
          fi
          echo "::add-mask::$token"
          echo "VLA_ADMIN_OIDC_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Certify protected Admin, Health, close dry-run and MKJ 15/15
        env:
          TARGET_URL: https://villalosapamates.netlify.app
        run: node tests/admin-ci-readonly-production.cjs

      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: admin-production-evidence
          path: |
            admin-production-preflight.json
            admin-authenticated-readonly-result.json
            admin-authenticated-readonly-error.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish successful production status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state=success \
            -f context='Admin Production Verification' \
            -f description='Admin protegido, Health y MKJ 15/15 certificados con OIDC read-only.' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Publish failed production status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state=failure \
            -f context='Admin Production Verification' \
            -f description='La certificación Admin/Health/MKJ read-only falló.' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
