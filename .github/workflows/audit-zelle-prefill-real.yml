name: Apply Zelle Runtime Patch

on:
  push:
    branches:
      - fix/zelle-prefill-real-20260828

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/zelle-prefill-real-20260828
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          package-manager-cache: false
      - name: Patch source
        run: python3 scripts/apply-zelle-runtime-fix.py
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run unit gates
        run: npm test
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'VLA Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Blindar prelectura Zelle en runtime'
          git push origin HEAD:fix/zelle-prefill-real-20260828