name: Apply Zelle Runtime Patch

on:
  push:
    branches:
      - fix/zelle-prefill-real-20260828

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/zelle-prefill-real-20260828
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          package-manager-cache: false
      - name: Patch source
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply-zelle-runtime-fix.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/payment-reference-precedence-v9.test.js')
          s=p.read_text()
          old="owner-mobile-fluid-v2-payment-report-tracking-v13-2026-08-15"
          new="owner-mobile-fluid-v2-payment-report-tracking-v14-2026-08-29"
          if old not in s:
              raise SystemExit('payment reference cache-busting assertion anchor not found')
          p.write_text(s.replace(old,new,1).replace('flujo de pagos v13','flujo de pagos v14',1))
          PY
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run unit gates
        run: npm test
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'VLA Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Blindar prelectura Zelle en runtime'
          git push origin HEAD:fix/zelle-prefill-real-20260828