name: Apply Zelle Prefill Runtime Fix

on:
  push:
    branches:
      - fix/zelle-prefill-real-20260828

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/zelle-prefill-real-20260828
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          package-manager-cache: false
      - name: Apply deterministic source patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          owner=Path('owner-payment-report-v3.js')
          text=owner.read_text()
          old="  function enteredAmount(){return window.VLAPaymentIntelligence.parseAmountInput(byId('payAmount')?.value)}"
          new="""  function fallbackParseAmount(value){
    if(typeof value==='number')return Number.isFinite(value)&&value>0?Math.round((value+Number.EPSILON)*100)/100:0;
    let raw=String(value??'').trim().replace(/[^0-9.,-]/g,'');if(!raw||raw.includes('-'))return 0;
    const commas=(raw.match(/,/g)||[]).length,dots=(raw.match(/\\./g)||[]).length;
    const withDecimal=separator=>{const index=raw.lastIndexOf(separator),integer=raw.slice(0,index).replace(/[.,]/g,'')||'0',decimals=raw.slice(index+1).replace(/[.,]/g,'');return Number(integer+(decimals?'.'+decimals:''))};
    let parsed;if(commas&&dots)parsed=withDecimal(raw.lastIndexOf(',')>raw.lastIndexOf('.')?',':'.');else if(commas||dots){const separator=commas?',':'.',count=commas||dots,parts=raw.split(separator),tail=parts[parts.length-1];parsed=count>1?(tail.length>0&&tail.length<=2?withDecimal(separator):Number(parts.join(''))):(tail.length===1||tail.length===2?withDecimal(separator):Number(parts.join('')))}else parsed=Number(raw);
    return Number.isFinite(parsed)&&parsed>0?Math.round((parsed+Number.EPSILON)*100)/100:0;
  }
  function paymentIntelligence(){const api=window.VLAPaymentIntelligence;return api&&typeof api.parseAmountInput==='function'&&typeof api.inferTargetMode==='function'?api:null}
  function enteredAmount(){const value=byId('payAmount')?.value,api=paymentIntelligence();if(api){try{return api.parseAmountInput(value)}catch(_){}}return fallbackParseAmount(value)}"""
          if old not in text: raise SystemExit('enteredAmount anchor not found')
          text=text.replace(old,new,1)

          old2="""  function syncModeFromEvidence(){
    const mode=byId('payMode'),currency=byId('payCurrency')?.value,cash=paymentChannel()==='CASH';if(!mode||modeUserChosen)return;
    const simple=cash?(currency==='BS'?'Bs BCV':currency==='USD'?'USD':''):suggestedMode(currency);
    if(cash){mode.value=simple;return}
    const inference=window.VLAPaymentIntelligence.inferTargetMode({enteredCurrency:currency,amount:enteredAmount(),rate:fxRate(),debtUsd:accountBalance('USD'),debtBs:accountBalance('Bs BCV')});
    mode.value=inference.status==='clear'?inference.mode:simple;
  }"""
          new2="""  function syncModeFromEvidence(){
    const mode=byId('payMode'),currency=byId('payCurrency')?.value,cash=paymentChannel()==='CASH';if(!mode||modeUserChosen)return;
    const simple=cash?(currency==='BS'?'Bs BCV':currency==='USD'?'USD':''):suggestedMode(currency);
    if(cash){mode.value=simple;return}
    const api=paymentIntelligence();if(!api){mode.value=simple;return}
    try{const inference=api.inferTargetMode({enteredCurrency:currency,amount:enteredAmount(),rate:fxRate(),debtUsd:accountBalance('USD'),debtBs:accountBalance('Bs BCV')});mode.value=inference.status==='clear'?inference.mode:simple}catch(_){mode.value=simple}
  }"""
          if old2 not in text: raise SystemExit('syncModeFromEvidence anchor not found')
          owner.write_text(text.replace(old2,new2,1))

          edge=Path('netlify/edge-functions/owner-mobile-assets.js')
          e=edge.read_text()
          old_release="const MOBILE_RELEASE='owner-mobile-fluid-v2-payment-report-tracking-v13-2026-08-15-cross-device-v1-plant-v1-2026-08-21';"
          new_release="const MOBILE_RELEASE='owner-mobile-fluid-v2-payment-report-tracking-v14-2026-08-29-prefill-runtime-v1';"
          if old_release not in e: raise SystemExit('mobile release anchor not found')
          edge.write_text(e.replace(old_release,new_release,1))

          browser=Path('tests/payment-prefill-client-race-browser.cjs')
          b=browser.read_text()
          old_sig="async function fixturePage(browser,{compressLegacyWatchdog=false}={}){"
          new_sig="async function fixturePage(browser,{compressLegacyWatchdog=false,loadIntelligence=true}={}){"
          if old_sig not in b: raise SystemExit('browser fixture signature anchor not found')
          b=b.replace(old_sig,new_sig,1)
          old_load=" await page.addScriptTag({path:path.resolve('payment-report-intelligence.js')});"
          new_load=" if(loadIntelligence)await page.addScriptTag({path:path.resolve('payment-report-intelligence.js')});"
          if old_load not in b: raise SystemExit('browser helper load anchor not found')
          b=b.replace(old_load,new_load,1)
          addition=r'''

test('una respuesta valida conserva la prelectura aunque el helper local no cargue',async()=>{
 const browser=await chromium.launch({headless:true,...(process.env.CHROMIUM_EXECUTABLE_PATH?{executablePath:process.env.CHROMIUM_EXECUTABLE_PATH}:{})});
 const page=await fixturePage(browser,{loadIntelligence:false});
 try{
  await page.route('**/api/vla/payment-proof-prefill',route=>route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({success:true,complete:true,analysis:{amount:60,currency:'USD',reference:'',bank:'Zelle',method:'ZELLE',transactionDate:'',transactionDateSource:'UNDETERMINED',transactionDateConfidence:'LOW',transactionDateNeedsReview:true,transactionDateEvidence:'Pantalla de confirmacion sin fecha visible.',transactionStatus:'SENT',recipient:'Receptor autorizado',recipientClassification:'CONFIRMED',recipientNeedsReview:false,confidence:.99,warnings:[]},analysisProvider:'proxy:fixture',analysisRoute:'proxy',missing:[]})}));
  await page.setInputFiles('#payProof',proof('zelle-helper-ausente'));
  await page.waitForFunction(()=>document.getElementById('payAmount').value==='60');
  assert.equal(await page.locator('#payCurrency').inputValue(),'USD');
  assert.doesNotMatch(await page.locator('#vla-pay-scan').innerText(),/No pudimos leerlo completo/i);
  assert.equal(await page.locator('#vla-pay-confirmation').isVisible(),true);
  assert.equal(await page.locator('#submitReport').isEnabled(),true);
 }finally{await browser.close()}
});
'''
          if 'helper local no cargue' not in b: b += addition
          browser.write_text(b)

          static=Path('tests/payment-prefill-runtime-fallback.test.js')
          static.write_text("""'use strict';
const test=require('node:test');
const assert=require('node:assert/strict');
const fs=require('node:fs');
const owner=fs.readFileSync('owner-payment-report-v3.js','utf8');
const edge=fs.readFileSync('netlify/edge-functions/owner-mobile-assets.js','utf8');
test('prefill no depende obligatoriamente del helper local',()=>{
 assert.match(owner,/function fallbackParseAmount/);
 assert.match(owner,/function paymentIntelligence/);
 assert.doesNotMatch(owner,/return window\.VLAPaymentIntelligence\.parseAmountInput/);
 assert.match(owner,/if\(!api\)\{mode\.value=simple;return\}/);
});
test('cambio de runtime fuerza renovacion de assets en dispositivos existentes',()=>{
 assert.match(edge,/payment-report-tracking-v14-2026-08-29-prefill-runtime-v1/);
 assert.ok(edge.indexOf('id=\\\"vla-payment-intelligence\\\"')<edge.indexOf('id=\\\"vla-owner-payment-report-v3\\\"'));
});
""")

          for path in ['.github/workflows/audit-zelle-prefill-real.yml','.github/workflows/apply-zelle-prefill-runtime-fix.yml','.runtime-fix-trigger']:
            p=Path(path)
            if p.exists(): p.unlink()
          PY
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run unit and static gates
        run: npm test
      - name: Commit isolated fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'VLA Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Blindar prelectura Zelle en runtime [runtime-fix-applied]'
          git push origin HEAD:fix/zelle-prefill-real-20260828