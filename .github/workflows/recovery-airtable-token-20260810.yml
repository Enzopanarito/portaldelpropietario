name: Recover VLA Airtable Production Token

on:
  push:
    branches:
      - recovery/vla-airtable-token-20260810

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_PRODUCTION_SHA: a027c5b4c0027ba487fcadb17164f79e0a08ea82
      NETLIFY_AUTH_TOKEN_PRIMARY: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_AUTH_TOKEN_FALLBACK: ${{ secrets.NETLIFY_TOKEN }}
      NETLIFY_SITE_ID_PRIMARY: ${{ secrets.NETLIFY_SITE_ID }}
      NETLIFY_SITE_ID_FALLBACK: ${{ secrets.NETLIFY_SITE_ID_VILLALOSAPAMATES }}
      AWS_LAMBDA_JS_RUNTIME: nodejs24.x
    steps:
      - name: Checkout exact currently-published source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.EXPECTED_PRODUCTION_SHA }}

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies safely
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run complete release test suite
        run: npm test

      - name: Resolve canonical publish directory
        id: release
        shell: bash
        run: |
          set -euo pipefail
          publish_dir="$(node -e "const r=require('./release.json');const d=String(r.productionPublishDirectory||'').trim();if(!d)process.exit(1);process.stdout.write(d)")"
          echo "publish_dir=$publish_dir" >> "$GITHUB_OUTPUT"

      - name: Build exact artifact in GitHub, not Netlify
        env:
          CONTEXT: production
          VLA_DATA_ENVIRONMENT: production
        run: npm run build:public

      - name: Resolve Netlify credentials safely
        shell: bash
        run: |
          set -euo pipefail
          AUTH_TOKEN="${NETLIFY_AUTH_TOKEN_PRIMARY:-${NETLIFY_AUTH_TOKEN_FALLBACK:-}}"
          SITE_ID="${NETLIFY_SITE_ID_PRIMARY:-${NETLIFY_SITE_ID_FALLBACK:-}}"
          [ -n "$AUTH_TOKEN" ] && echo "::add-mask::$AUTH_TOKEN"
          [ -n "$SITE_ID" ] && echo "::add-mask::$SITE_ID"
          [ -n "$AUTH_TOKEN" ] && [ -n "$SITE_ID" ] || { echo "Faltan credenciales Netlify; abortando sin publicar."; exit 1; }
          echo "NETLIFY_AUTH_TOKEN=$AUTH_TOKEN" >> "$GITHUB_ENV"
          echo "NETLIFY_SITE_ID=$SITE_ID" >> "$GITHUB_ENV"

      - name: Assert production has not moved
        shell: bash
        run: |
          set -euo pipefail
          site_json="$(curl --fail-with-body --silent --show-error -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID")"
          current_id="$(printf '%s' "$site_json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);process.stdout.write(String(j.published_deploy?.id||j.deploy_id||''))})")"
          [ -n "$current_id" ] || { echo "No pude resolver deploy actual; abortando."; exit 1; }
          deploy_json="$(curl --fail-with-body --silent --show-error -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" "https://api.netlify.com/api/v1/deploys/$current_id")"
          title="$(printf '%s' "$deploy_json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);process.stdout.write(String(j.title||''))})")"
          case "$title" in
            *"$EXPECTED_PRODUCTION_SHA"*) echo "PRODUCTION_SOURCE_OK $EXPECTED_PRODUCTION_SHA" ;;
            *) echo "Producción cambió: $title. Abortando sin publicar."; exit 1 ;;
          esac

      - name: Capture immediate BEFORE financial baseline
        id: before
        shell: bash
        run: |
          set -euo pipefail
          before="${RUNNER_TEMP}/vla-before.json"
          curl --fail-with-body --silent --show-error --location --max-time 60 \
            "https://villalosapamates.netlify.app/api/vla/public-data?force=1&recovery_before=${GITHUB_RUN_ID}" \
            --output "$before"
          node - "$before" <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const owners=Array.isArray(data.propietarios)?data.propietarios:[];
          if(owners.length!==15)throw new Error(`BEFORE devolvió ${owners.length}/15 casas.`);
          for(let casa=1;casa<=15;casa++)if(!owners.some(o=>Number(o.Casa)===casa))throw new Error(`BEFORE no contiene Casa ${casa}.`);
          console.log('BEFORE_FINANCIAL_BASELINE_OK 15/15');
          NODE
          echo "path=$before" >> "$GITHUB_OUTPUT"

      - name: Upload exact source to production without Netlify hosted build
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          output="${RUNNER_TEMP}/netlify-recovery.json"
          npx --yes netlify-cli@latest deploy \
            --prod \
            --no-build \
            --dir="${{ steps.release.outputs.publish_dir }}" \
            --functions=netlify/functions \
            --site="$NETLIFY_SITE_ID" \
            --auth="$NETLIFY_AUTH_TOKEN" \
            --skip-functions-cache \
            --message="VLA production commit=${EXPECTED_PRODUCTION_SHA}" \
            --json > "$output"
          node - "$output" "$GITHUB_OUTPUT" <<'NODE'
          const fs=require('fs');
          const [file,out]=process.argv.slice(2);
          const data=JSON.parse(fs.readFileSync(file,'utf8'));
          const id=String(data.deploy_id||data.id||'');
          if(!id)throw new Error('Netlify CLI no devolvió deploy_id.');
          fs.appendFileSync(out,`deploy_id=${id}\n`);
          console.log(`RECOVERY_DEPLOY_ID=${id}`);
          NODE

      - name: Verify deploy metadata and runtime
        env:
          DEPLOY_ID: ${{ steps.deploy.outputs.deploy_id }}
        shell: bash
        run: |
          set -euo pipefail
          deploy_file="${RUNNER_TEMP}/deploy.json"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            "https://api.netlify.com/api/v1/deploys/$DEPLOY_ID" --output "$deploy_file"
          node - "$deploy_file" <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(d.state!=='ready')throw new Error(`Deploy state=${d.state}`);
          if(d.context!=='production')throw new Error(`Deploy context=${d.context}`);
          if(d.build_id)throw new Error(`Recovery unexpectedly used hosted build ${d.build_id}`);
          const expected=process.env.EXPECTED_PRODUCTION_SHA;
          if(!String(d.title||'').includes(expected))throw new Error(`Deploy title does not bind exact source: ${d.title||''}`);
          const functions=Array.isArray(d.available_functions)?d.available_functions:[];
          if(functions.length!==63)throw new Error(`Expected 63 Functions, got ${functions.length}`);
          const runtimes=[...new Set(functions.map(fn=>String(fn.r||fn.runtime||'unknown')))];
          if(runtimes.length!==1||runtimes[0]!=='nodejs24.x')throw new Error(`Unexpected Function runtime: ${runtimes.join(',')}`);
          console.log(`DEPLOY_METADATA_OK functions=${functions.length} runtime=${runtimes[0]} hostedBuild=no`);
          NODE

      - name: Verify Airtable-backed admin authentication is loaded
        shell: bash
        run: |
          set -euo pipefail
          body="${RUNNER_TEMP}/login-probe.json"
          code="$(curl --silent --show-error --location --max-time 45 --output "$body" --write-out '%{http_code}' \
            -X POST -H 'content-type: application/json' \
            --data '{"password":"__VLA_RECOVERY_PROBE_INVALID_20260810__"}' \
            'https://villalosapamates.netlify.app/.netlify/functions/login')"
          node - "$body" "$code" <<'NODE'
          const fs=require('fs');
          const [file,code]=process.argv.slice(2);
          let data={};try{data=JSON.parse(fs.readFileSync(file,'utf8'))}catch{}
          const message=String(data.message||data.error||'');
          if(code!=='401')throw new Error(`Login probe HTTP ${code}; response=${message.slice(0,160)}`);
          if(/no est[aá] configurada|airtable|token/i.test(message))throw new Error(`Login still cannot load auth config: ${message}`);
          console.log('ADMIN_AUTH_CONFIG_LOADED_OK wrong-password probe returned 401 as expected');
          NODE

      - name: Compare AFTER against BEFORE in exact cents
        env:
          BEFORE_PATH: ${{ steps.before.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail
          after="${RUNNER_TEMP}/vla-after.json"
          curl --fail-with-body --silent --show-error --location --max-time 60 \
            "https://villalosapamates.netlify.app/api/vla/public-data?force=1&recovery_after=${GITHUB_RUN_ID}" \
            --output "$after"
          node - "$BEFORE_PATH" "$after" <<'NODE'
          const fs=require('fs');
          const [beforePath,afterPath]=process.argv.slice(2);
          const fields=['saldoUsd','saldoBsRef','totalPagadero','saldoNetoReferencial','saldoFavorUsd','saldoFavorBs','deudaVencidaUsd','deudaVencidaBs','mesCorrienteUsd','mesCorrienteBs'];
          const money=v=>Math.round((Number(v)||0)*100);
          const load=p=>{const d=JSON.parse(fs.readFileSync(p,'utf8'));const owners=Array.isArray(d.propietarios)?d.propietarios:[];if(owners.length!==15)throw new Error(`${p}: ${owners.length}/15 casas`);return new Map(owners.map(o=>[Number(o.Casa),o]))};
          const before=load(beforePath),after=load(afterPath),diffs=[];let absolute=0;
          for(let casa=1;casa<=15;casa++){
            const a=before.get(casa),b=after.get(casa);if(!a||!b)throw new Error(`Casa ${casa} ausente.`);
            for(const field of fields){const av=money(a[field]),bv=money(b[field]),delta=bv-av;absolute+=Math.abs(delta);if(delta)diffs.push({casa,field,before:av/100,after:bv/100,diff:delta/100});}
          }
          console.log(`FINANCIAL_FIELDS_CHECKED=${15*fields.length}`);
          console.log(`ABSOLUTE_DIFFERENCE=${(absolute/100).toFixed(2)}`);
          if(diffs.length){console.error(JSON.stringify({diffs},null,2));process.exit(1)}
          console.log('FINANCIAL_BEFORE_AFTER_OK 15/15 houses · 150/150 fields · $0.00');
          NODE

      - name: Recovery summary
        if: always()
        shell: bash
        run: |
          {
            echo '### VLA Airtable token recovery'
            echo
            echo "Exact production source: \`$EXPECTED_PRODUCTION_SHA\`"
            echo 'Build location: GitHub runner'
            echo 'Netlify hosted build: disabled (`--no-build`)'
            echo 'Financial certification target: 15/15 houses · 150/150 fields · $0.00'
          } >> "$GITHUB_STEP_SUMMARY"
