name: Classify Netlify Sensitive Environment Variables

on:
  pull_request:
    branches: [main]
    types: [edited]

permissions:
  contents: read

jobs:
  classify:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/vla-10of10-hardening-20260809' &&
      contains(github.event.pull_request.title, '[skip netlify]') &&
      contains(github.event.pull_request.title, '[classify secrets]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NETLIFY_AUTH_TOKEN_PRIMARY: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_AUTH_TOKEN_FALLBACK: ${{ secrets.NETLIFY_TOKEN }}
      NETLIFY_SITE_ID_PRIMARY: ${{ secrets.NETLIFY_SITE_ID }}
      NETLIFY_SITE_ID_FALLBACK: ${{ secrets.NETLIFY_SITE_ID_VILLALOSAPAMATES }}
    steps:
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Resolve Netlify credentials without exposing them
        shell: bash
        run: |
          set -euo pipefail
          AUTH_TOKEN="${NETLIFY_AUTH_TOKEN_PRIMARY:-${NETLIFY_AUTH_TOKEN_FALLBACK:-}}"
          SITE_ID="${NETLIFY_SITE_ID_PRIMARY:-${NETLIFY_SITE_ID_FALLBACK:-}}"
          [ -n "$AUTH_TOKEN" ] || { echo 'Falta token Netlify.'; exit 1; }
          [ -n "$SITE_ID" ] || { echo 'Falta Site ID Netlify.'; exit 1; }
          echo "::add-mask::$AUTH_TOKEN"
          echo "::add-mask::$SITE_ID"
          echo "NETLIFY_AUTH_TOKEN=$AUTH_TOKEN" >> "$GITHUB_ENV"
          echo "NETLIFY_SITE_ID=$SITE_ID" >> "$GITHUB_ENV"

      - name: Mark existing sensitive values as Netlify secrets without changing them
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const token=process.env.NETLIFY_AUTH_TOKEN;
          const siteId=process.env.NETLIFY_SITE_ID;
          const api='https://api.netlify.com/api/v1';
          const keys=['AIRTABLE_API_TOKEN','SMTP_SECRET','MKJ_ADMIN_PASSWORD','ADMIN_TOKEN_SECRET'];
          const headers={Authorization:`Bearer ${token}`,'Content-Type':'application/json','User-Agent':'VLA-secret-hardening'};
          const normalizeScope=value=>String(value||'').replaceAll('_','-');
          const writableValue=value=>({
            value:String(value?.value??''),
            context:String(value?.context||'all'),
            ...(value?.context_parameter?{context_parameter:String(value.context_parameter)}:{})
          });
          const valueSignature=values=>(values||[]).map(value=>({context:value.context||'all',context_parameter:value.context_parameter||'',value:String(value.value??'')}));
          async function json(response,label){
            const body=await response.json().catch(()=>({}));
            if(!response.ok)throw new Error(`${label} respondió HTTP ${response.status}.`);
            return body;
          }
          (async()=>{
            const site=await json(await fetch(`${api}/sites/${encodeURIComponent(siteId)}`,{headers}), 'Netlify site');
            const accountId=String(site.account_id||site.account_slug||'').trim();
            if(!accountId)throw new Error('Netlify no devolvió account_id para el sitio.');
            const changed=[];
            const already=[];
            for(const key of keys){
              const endpoint=`${api}/accounts/${encodeURIComponent(accountId)}/env/${encodeURIComponent(key)}?site_id=${encodeURIComponent(siteId)}`;
              const variable=await json(await fetch(endpoint,{headers}), `Lectura ${key}`);
              if(variable.is_secret===true){already.push(key);continue;}
              const originalValues=Array.isArray(variable.values)?variable.values:null;
              const originalScopes=Array.isArray(variable.scopes)?variable.scopes:null;
              if(!originalValues||!originalValues.length)throw new Error(`${key} no tiene valores que preservar.`);
              if(!originalScopes||!originalScopes.length)throw new Error(`${key} no tiene scopes que preservar.`);
              const values=originalValues.map(writableValue);
              const scopes=originalScopes.map(normalizeScope);
              const before=valueSignature(values);
              const payload={key:variable.key||key,scopes,values,is_secret:true};
              await json(await fetch(endpoint,{method:'PUT',headers,body:JSON.stringify(payload)}), `Actualización ${key}`);
              const verified=await json(await fetch(endpoint,{headers}), `Verificación ${key}`);
              if(verified.is_secret!==true)throw new Error(`${key} no quedó marcado como secret.`);
              const verifiedScopes=(verified.scopes||[]).map(normalizeScope);
              if(JSON.stringify(verifiedScopes)!==JSON.stringify(scopes))throw new Error(`${key} cambió sus scopes durante la clasificación.`);
              // Netlify oculta el valor al convertirlo en secret, por lo que se verifica
              // identidad de contextos y cantidad. La preservación byte-a-byte queda
              // garantizada por el payload construido directamente desde la lectura previa.
              const afterContexts=(verified.values||[]).map(value=>({context:value.context||'all',context_parameter:value.context_parameter||''}));
              const beforeContexts=before.map(value=>({context:value.context,context_parameter:value.context_parameter}));
              if(JSON.stringify(afterContexts)!==JSON.stringify(beforeContexts))throw new Error(`${key} cambió sus contextos durante la clasificación.`);
              changed.push(key);
            }
            console.log(`NETLIFY_SECRET_CLASSIFICATION_OK changed=${changed.length} already=${already.length} total=${keys.length}`);
          })().catch(error=>{console.error(String(error.message||error));process.exit(1)});
          NODE
