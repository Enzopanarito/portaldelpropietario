name: Force repaired admin login deployment now

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/trigger-netlify-rebuild-once.yml

permissions:
  contents: write

jobs:
  deploy-and-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN || secrets.NETLIFY_TOKEN }}
      NETLIFY_SITE_ID: 74f4f122-352c-4a3b-aa6f-5937ab99f8d3
    steps:
      - uses: actions/checkout@v4

      - name: Force latest main deployment
        shell: bash
        run: |
          set -euo pipefail
          test -n "${NETLIFY_AUTH_TOKEN:-}" || { echo "::error::Missing Netlify token"; exit 1; }
          curl -fsS -X POST \
            -H "Authorization: Bearer ${NETLIFY_AUTH_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.netlify.com/api/v1/sites/${NETLIFY_SITE_ID}/builds" >/dev/null

      - name: Wait for repaired auth and capture responses
        shell: bash
        run: |
          set -u -o pipefail
          mkdir -p diagnostics
          health_body=$(mktemp)
          login_body=$(mktemp)
          health_code="000"
          login_code="000"

          for attempt in $(seq 1 42); do
            sleep 10
            health_code=$(curl -sS --max-time 30 -o "$health_body" -w '%{http_code}' \
              -H 'Cache-Control: no-cache' \
              "https://villalosapamates.netlify.app/.netlify/functions/admin-login-health?force=${GITHUB_RUN_ID}-${attempt}" || true)
            login_code=$(curl -sS --max-time 30 -o "$login_body" -w '%{http_code}' \
              -X POST \
              -H 'Content-Type: application/json' \
              -H 'Cache-Control: no-cache' \
              --data '{"password":"__VLA_DIAGNOSTIC_INVALID__"}' \
              "https://villalosapamates.netlify.app/.netlify/functions/login" || true)

            if [ "$health_code" = "200" ] \
              && grep -q '"ok":true' "$health_body" \
              && grep -q '"sessionSecretStrong":true' "$health_body"; then
              break
            fi
          done

          {
            echo "checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "health_http_status=$health_code"
            echo "login_invalid_password_http_status=$login_code"
            echo "health_body="
            cat "$health_body" 2>/dev/null || true
            echo
            echo "login_body="
            cat "$login_body" 2>/dev/null || true
            echo
          } > diagnostics/admin-login-final-result.txt
          cat diagnostics/admin-login-final-result.txt

      - name: Commit final production response
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "vla-diagnostic-bot"
          git config user.email "actions@users.noreply.github.com"
          git add diagnostics/admin-login-final-result.txt
          git commit -m "Confirmar respuesta final del acceso administrativo" || exit 0
          git pull --rebase origin main
          git push
