name: Verify repaired admin login once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/trigger-netlify-rebuild-once.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify complete session issuance in production
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          body_file=$(mktemp)
          status=$(curl -sS -o "$body_file" -w "%{http_code}" \
            -H "Cache-Control: no-cache" \
            "https://villalosapamates.netlify.app/.netlify/functions/admin-login-health?ts=$(date +%s)")
          {
            echo "checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "http_status=$status"
            echo "response_body="
            cat "$body_file"
            echo
          } > diagnostics/admin-login-repair-result.txt
          if [ "$status" != "200" ] || ! grep -q '"ok":true' "$body_file"; then
            echo "::error::Admin session health check failed."
            exit 1
          fi
      - name: Commit verified result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "vla-diagnostic-bot"
          git config user.email "actions@users.noreply.github.com"
          git add diagnostics/admin-login-repair-result.txt
          git commit -m "Confirmar reparación del acceso administrativo" || exit 0
          git pull --rebase origin main
          git push
