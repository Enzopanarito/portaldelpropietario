name: Capture real admin login result now

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/trigger-netlify-rebuild-once.yml

permissions:
  contents: write

jobs:
  capture-login-result:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Capture health and login responses
        shell: bash
        run: |
          set -u -o pipefail
          mkdir -p diagnostics
          health_body=$(mktemp)
          login_body=$(mktemp)
          health_code="000"
          login_code="000"

          for attempt in $(seq 1 6); do
            health_code=$(curl -sS --max-time 30 -o "$health_body" -w '%{http_code}' \
              -H 'Cache-Control: no-cache' \
              "https://villalosapamates.netlify.app/.netlify/functions/admin-login-health?capture=${GITHUB_RUN_ID}-${attempt}" || true)
            login_code=$(curl -sS --max-time 30 -o "$login_body" -w '%{http_code}' \
              -X POST \
              -H 'Content-Type: application/json' \
              -H 'Cache-Control: no-cache' \
              --data '{"password":"__VLA_DIAGNOSTIC_INVALID__"}' \
              "https://villalosapamates.netlify.app/.netlify/functions/login" || true)
            [ "$health_code" != "000" ] && [ "$login_code" != "000" ] && break
            sleep 5
          done

          {
            echo "checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "health_http_status=$health_code"
            echo "login_invalid_password_http_status=$login_code"
            echo "health_body="
            cat "$health_body" 2>/dev/null || true
            echo
            echo "login_body="
            cat "$login_body" 2>/dev/null || true
            echo
          } > diagnostics/admin-login-final-result.txt

          cat diagnostics/admin-login-final-result.txt

      - name: Commit captured result regardless of outcome
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "vla-diagnostic-bot"
          git config user.email "actions@users.noreply.github.com"
          git add diagnostics/admin-login-final-result.txt
          git commit -m "Capturar resultado real del acceso administrativo" || exit 0
          git pull --rebase origin main
          git push
