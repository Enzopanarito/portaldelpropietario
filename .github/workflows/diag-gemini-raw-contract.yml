name: DIAG Gemini Raw Contract

on:
  pull_request:
    paths:
      - '.github/workflows/diag-gemini-raw-contract.yml'

permissions:
  contents: read

jobs:
  raw-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NETLIFY_AUTH_TOKEN_PRIMARY: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_AUTH_TOKEN_FALLBACK: ${{ secrets.NETLIFY_TOKEN }}
      NETLIFY_SITE_ID_PRIMARY: ${{ secrets.NETLIFY_SITE_ID }}
      NETLIFY_SITE_ID_FALLBACK: ${{ secrets.NETLIFY_SITE_ID_VILLALOSAPAMATES }}
    steps:
      - name: Resolve Gemini key privately
        shell: bash
        run: |
          set -euo pipefail
          AUTH_TOKEN="${NETLIFY_AUTH_TOKEN_PRIMARY:-${NETLIFY_AUTH_TOKEN_FALLBACK:-}}"
          SITE_ID="${NETLIFY_SITE_ID_PRIMARY:-${NETLIFY_SITE_ID_FALLBACK:-}}"
          [ -n "$AUTH_TOKEN" ] && [ -n "$SITE_ID" ] || exit 1
          echo "::add-mask::$AUTH_TOKEN"
          site_json="$(curl --fail-with-body --silent --show-error -H "Authorization: Bearer $AUTH_TOKEN" -H 'User-Agent: VLA-Gemini-Raw' "https://api.netlify.com/api/v1/sites/$SITE_ID")"
          account_id="$(printf '%s' "$site_json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(String(JSON.parse(s).account_id||'')))")"
          env_json="$(curl --fail-with-body --silent --show-error -H "Authorization: Bearer $AUTH_TOKEN" -H 'User-Agent: VLA-Gemini-Raw' "https://api.netlify.com/api/v1/accounts/$account_id/env/GEMINI_API_KEY?site_id=$SITE_ID")"
          gemini_key="$(printf '%s' "$env_json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s),v=Array.isArray(j.values)?j.values:[];const p=v.find(x=>x.context==='production'&&String(x.value||'').trim());const a=v.find(x=>x.context==='all'&&String(x.value||'').trim());process.stdout.write(String((p||a||{}).value||''))})")"
          [ -n "$gemini_key" ] || exit 1
          echo "::add-mask::$gemini_key"
          echo "GEMINI_API_KEY=$gemini_key" >> "$GITHUB_ENV"

      - name: Generate small JPEG and payload fragments
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          import base64,json
          from PIL import Image,ImageDraw
          im=Image.new('RGB',(640,480),'white'); d=ImageDraw.Draw(im); d.text((50,80),'Monto Bs 12345.67\nReferencia 987654321012\nPago movil completado',fill='black'); im.save('proof.jpg',quality=90)
          b64=base64.b64encode(open('proof.jpg','rb').read()).decode()
          open('image-part.json','w').write(json.dumps({'inlineData':{'mimeType':'image/jpeg','data':b64}}))
          PY

      - name: Probe raw Gemini REST contract
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const key=process.env.GEMINI_API_KEY;
          const model='gemini-3.6-flash';
          const base=`https://generativelanguage.googleapis.com/v1beta`;
          const imagePart=JSON.parse(fs.readFileSync('image-part.json','utf8'));
          const headers={'x-goog-api-key':key,'content-type':'application/json'};
          const clean=(x)=>String(x??'').replace(/AIza[0-9A-Za-z_-]+/g,'[REDACTED]').slice(0,800);
          async function probe(label,url,options={}){
            const t=Date.now();
            try{
              const r=await fetch(url,{...options,headers:{...headers,...(options.headers||{})}});
              const text=await r.text(); let j={}; try{j=JSON.parse(text)}catch(_){}
              const e=j.error||{};
              console.log(JSON.stringify({label,http:r.status,elapsedMs:Date.now()-t,errorStatus:clean(e.status),errorMessage:clean(e.message),detailTypes:Array.isArray(e.details)?e.details.map(x=>clean(x?.['@type']||x?.reason||'')).filter(Boolean):[],hasCandidates:Array.isArray(j.candidates)&&j.candidates.length>0}));
              return {ok:r.ok,status:r.status,json:j};
            }catch(err){console.log(JSON.stringify({label,transportError:clean(err?.message),elapsedMs:Date.now()-t}));return{ok:false,status:0,json:{}}}
          }
          const post=(body)=>({method:'POST',body:JSON.stringify(body)});
          (async()=>{
            await probe('models-list-header',`${base}/models?pageSize=50`);
            await probe('model-get-header',`${base}/models/${model}`);
            await probe('text-minimal',`${base}/models/${model}:generateContent`,post({contents:[{parts:[{text:'Reply only OK'}]}]}));
            await probe('text-json-mime',`${base}/models/${model}:generateContent`,post({contents:[{parts:[{text:'Return JSON with ok true'}]}],generationConfig:{responseMimeType:'application/json'}}));
            await probe('image-minimal',`${base}/models/${model}:generateContent`,post({contents:[{parts:[{text:'Read amount and reference from this receipt.'},imagePart]}]}));
            await probe('image-json-mime',`${base}/models/${model}:generateContent`,post({contents:[{parts:[{text:'Return amount and reference as JSON.'},imagePart]}],generationConfig:{responseMimeType:'application/json'}}));
            await probe('image-simple-json-schema',`${base}/models/${model}:generateContent`,post({contents:[{parts:[{text:'Return amount and reference.'},imagePart]}],generationConfig:{responseMimeType:'application/json',responseJsonSchema:{type:'object',properties:{amount:{type:'number'},reference:{type:'string'}},required:['amount','reference'],additionalProperties:false}}}));
            await probe('legacy-temperature',`${base}/models/${model}:generateContent`,post({contents:[{parts:[{text:'Reply only OK'}]}],generationConfig:{temperature:0,responseMimeType:'application/json'}}));
          })().catch(e=>{console.error(clean(e?.message||e));process.exit(1)});
          NODE
