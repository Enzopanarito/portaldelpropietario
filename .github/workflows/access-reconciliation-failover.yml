name: VLA Access Reconciliation Failover

on:
  schedule:
    - cron: '15 * * * *'
  workflow_run:
    workflows: ["Deploy Netlify Production"]
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Modo de ejecución manual'
        required: true
        default: probe
        type: choice
        options:
          - probe
          - dispatch

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: vla-access-reconciliation-failover
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_URL: https://villalosapamates.netlify.app
      ALERT_TITLE: '🚨 VLA Access reconciliation failover: atención requerida'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Select safe reconciliation mode
        id: mode
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            mode="${{ inputs.mode }}"
          else
            mode=dispatch
          fi
          case "$mode" in
            probe|dispatch) ;;
            *) echo "Modo no permitido: $mode"; exit 1 ;;
          esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Request short-lived GitHub OIDC identity
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=vla-access-reconciliation-failover")"
          token="$(printf '%s' "$response" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);process.stdout.write(String(j.value||''))})")"
          test -n "$token"
          echo "::add-mask::$token"
          echo "VLA_ACCESS_OIDC_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Execute and verify protected access reconciliation
        shell: bash
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -euo pipefail
          request="${RUNNER_TEMP}/access-failover-request.json"
          response="${RUNNER_TEMP}/access-failover-response.json"
          MODE="$MODE" node - "$request" <<'NODE'
          const fs=require('fs');
          fs.writeFileSync(process.argv[2],JSON.stringify({
            oidcToken:process.env.VLA_ACCESS_OIDC_TOKEN,
            mode:process.env.MODE
          }));
          NODE
          code="$(curl --silent --show-error --location \
            --request POST \
            --header 'Content-Type: application/json' \
            --data-binary @"$request" \
            --output "$response" \
            --write-out '%{http_code}' \
            --max-time 60 \
            "${TARGET_URL}/.netlify/functions/access-reconciliation-failover-ci")"
          rm -f "$request"
          cat "$response"
          expected=200
          if [ "$code" != "$expected" ]; then
            echo "Reconciliación verificada devolvió HTTP $code; esperado $expected."
            exit 1
          fi

      - name: Close access failover incident after success
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title | jq -r --arg title "$ALERT_TITLE" '.[] | select(.title == $title) | .number' | head -1)"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "✅ El canal externo de reconciliación volvió a responder correctamente el $(date -u +'%Y-%m-%dT%H:%M:%SZ')."
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY" --reason completed
          fi

      - name: Open one access failover incident on failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title | jq -r --arg title "$ALERT_TITLE" '.[] | select(.title == $title) | .number' | head -1)"
          body="El canal externo de reconciliación del portón falló. No se alteran saldos: el sistema conserva las reglas automáticas canónicas y queda fail-closed para discrepancias inseguras.\n\n- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\n- Detectado: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          if [ -z "$existing" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$ALERT_TITLE" --body "$body"
          else
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          fi
