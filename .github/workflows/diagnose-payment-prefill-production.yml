name: Verify Payment Prefill Production

on:
  workflow_run:
    workflows: ["Deploy Netlify Production"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  verify-production-prefill:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Generate realistic large receipt
        shell: bash
        env:
          OWNER_ID: recSyntheticAI002
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          import base64, json, os
          from PIL import Image, ImageDraw, ImageFont, ImageFilter

          w,h=1800,2400
          bg=Image.effect_noise((w,h),24).convert('RGB').filter(ImageFilter.GaussianBlur(.35))
          draw=ImageDraw.Draw(bg)
          draw.rounded_rectangle((140,180,w-140,h-180),radius=44,fill=(248,248,246),outline=(210,210,205),width=5)
          font=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf',72)
          small=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf',60)
          title=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf',82)
          lines=[
              ('PAGO MOVIL COMPLETADO', title),
              ('Banco de Venezuela', font),
              ('Monto: Bs. 12.345,67', font),
              ('Fecha: 04/08/2026', font),
              ('Hora: 10:30 AM', small),
              ('Referencia: 987654321012', small),
              ('Estado: COMPLETADO', font),
              ('Receptor: Villa Los Apamates', small),
              ('Telefono: 0412-0000000', small),
          ]
          y=330
          for text, selected_font in lines:
              draw.text((260,y),text,fill=(20,25,30),font=selected_font)
              y+=185
          draw.text((260,h-410),'Comprobante de prueba CI - NO ES UN PAGO REAL',fill=(75,75,75),font=small)
          image=bg.rotate(.7,resample=Image.Resampling.BICUBIC,expand=False,fillcolor=(32,34,36))
          image.save('synthetic-receipt.jpeg',quality=94,optimize=True)
          content=open('synthetic-receipt.jpeg','rb').read()
          payload={
              'ownerId': os.environ['OWNER_ID'],
              'attachment': {
                  'name': 'synthetic-receipt.jpeg',
                  'type': 'image/jpeg',
                  'size': len(content),
                  'base64': base64.b64encode(content).decode('ascii'),
              },
          }
          open('prefill-request.json','w').write(json.dumps(payload))
          print('JPEG_BYTES='+str(len(content)))
          PY

      - name: Verify production prefill
        id: production
        shell: bash
        env:
          TARGET_URL: https://villalosapamates.netlify.app/api/vla/payment-proof-prefill
        run: |
          set -euo pipefail
          started="$(date +%s)"
          status="$(curl --silent --show-error --location \
            --output prefill-response.json \
            --write-out '%{http_code}' \
            --max-time 90 \
            --request POST "$TARGET_URL" \
            --header 'Content-Type: application/json' \
            --data-binary @prefill-request.json)"
          elapsed="$(( $(date +%s) - started ))"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "elapsed=$elapsed" >> "$GITHUB_OUTPUT"
          python3 - "$status" "$elapsed" <<'PY'
          import json, sys
          status=int(sys.argv[1]); elapsed=int(sys.argv[2])
          try:
              payload=json.load(open('prefill-response.json'))
          except Exception:
              payload={'message':'Respuesta no JSON'}
          safe={
              'status':status,
              'elapsedSeconds':elapsed,
              'success':payload.get('success'),
              'complete':payload.get('complete'),
              'reason':payload.get('reason'),
              'providerStatus':payload.get('providerStatus'),
              'analysisProvider':payload.get('analysisProvider'),
              'analysisRoute':payload.get('analysisRoute'),
              'message':payload.get('message'),
              'detectedCurrency':(payload.get('analysis') or {}).get('currency'),
              'detectedAmount':(payload.get('analysis') or {}).get('amount'),
              'detectedReferencePresent':bool((payload.get('analysis') or {}).get('reference')),
          }
          print(json.dumps(safe,indent=2,ensure_ascii=False))
          if status!=200 or payload.get('success') is not True:
              raise SystemExit(f'Production prefill returned HTTP {status}')
          if not payload.get('analysisProvider'):
              raise SystemExit('Production prefill did not identify the provider used')
          analysis=payload.get('analysis') or {}
          if analysis.get('currency')!='VES' or abs(float(analysis.get('amount') or 0)-12345.67)>0.01:
              raise SystemExit('Production prefill did not extract the expected amount and currency')
          if not analysis.get('reference'):
              raise SystemExit('Production prefill did not extract the reference')
          if elapsed>=45:
              raise SystemExit(f'Production prefill exceeded mobile-safe budget: {elapsed}s')
          PY

      - name: Publish successful production status
        if: success() && github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state=success \
            -f context='Payment Prefill Production Verification' \
            -f description='La lectura IA procesó un comprobante grande en producción.' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Publish failed production status
        if: failure() && github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state=failure \
            -f context='Payment Prefill Production Verification' \
            -f description='La lectura IA de comprobante grande falló en producción.' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
