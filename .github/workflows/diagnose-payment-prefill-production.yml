name: Diagnose Payment Prefill Production

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-payment-prefill-production.yml'
      - 'netlify/functions/payment-proof-prefill.js'
      - 'netlify/functions/_payment_ai_gemini.js'
      - 'netlify/functions/_payment_ai_model_discovery.js'

permissions:
  contents: read

jobs:
  diagnose-prefill:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Generate synthetic receipt
        shell: bash
        env:
          OWNER_ID: rec5z2pY1lFljVjnt
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          import base64, json, os
          from PIL import Image, ImageDraw, ImageFont

          image = Image.new('RGB', (1000, 850), 'white')
          draw = ImageDraw.Draw(image)
          font = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf', 42)
          title = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf', 50)
          lines = [
              ('PAGO MOVIL COMPLETADO', title),
              ('Banco de Venezuela', font),
              ('Monto: Bs. 12.345,67', font),
              ('Fecha: 04/08/2026', font),
              ('Referencia: 987654321012', font),
              ('Estado: COMPLETADO', font),
              ('Receptor: Villa Los Apamates', font),
          ]
          y = 80
          for text, selected_font in lines:
              draw.text((70, y), text, fill='black', font=selected_font)
              y += 100
          image.save('synthetic-receipt.png', optimize=True)
          content = open('synthetic-receipt.png', 'rb').read()
          encoded = base64.b64encode(content).decode('ascii')
          production = {
              'ownerId': os.environ['OWNER_ID'],
              'attachment': {
                  'name': 'synthetic-receipt.png',
                  'type': 'image/png',
                  'size': len(content),
                  'base64': encoded,
              },
          }
          proxy = {
              'content': encoded,
              'contentType': 'image/png',
              'promptVersion': 'VLA_PAYMENT_PROOF_V2_2026-07-13',
          }
          open('prefill-request.json', 'w').write(json.dumps(production))
          open('proxy-request.json', 'w').write(json.dumps(proxy))
          PY

      - name: Record current production reader result
        id: production
        continue-on-error: true
        shell: bash
        env:
          TARGET_URL: https://villalosapamates.netlify.app/api/vla/payment-proof-prefill
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --location \
            --output prefill-response.json \
            --write-out '%{http_code}' \
            --max-time 90 \
            --request POST "$TARGET_URL" \
            --header 'Content-Type: application/json' \
            --data-binary @prefill-request.json)"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          python3 - "$status" <<'PY'
          import json, sys
          status = int(sys.argv[1])
          try:
              payload = json.load(open('prefill-response.json'))
          except Exception:
              payload = {'message': 'Respuesta no JSON'}
          safe = {
              'status': status,
              'success': payload.get('success'),
              'complete': payload.get('complete'),
              'reason': payload.get('reason'),
              'providerStatus': payload.get('providerStatus'),
              'analysisProvider': payload.get('analysisProvider'),
              'message': payload.get('message'),
              'detectedCurrency': (payload.get('analysis') or {}).get('currency'),
              'detectedAmount': (payload.get('analysis') or {}).get('amount'),
              'detectedReferencePresent': bool((payload.get('analysis') or {}).get('reference')),
          }
          print('PRODUCTION_READER')
          print(json.dumps(safe, indent=2, ensure_ascii=False))
          if status != 200 or not payload.get('success'):
              raise SystemExit(f'Production prefill returned HTTP {status}')
          PY

      - name: Verify alternate reader independently
        id: proxy
        shell: bash
        env:
          PROXY_URL: https://gemini-proxy-seinca.vercel.app/api/payment-proof
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --location \
            --output proxy-response.json \
            --write-out '%{http_code}' \
            --max-time 90 \
            --request POST "$PROXY_URL" \
            --header 'Content-Type: application/json' \
            --header 'X-VLA-Client: villa-los-apamates-payment-proof-v1' \
            --data-binary @proxy-request.json)"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          python3 - "$status" <<'PY'
          import json, sys
          status = int(sys.argv[1])
          try:
              payload = json.load(open('proxy-response.json'))
          except Exception:
              payload = {'message': 'Respuesta no JSON'}
          raw = payload.get('raw') or ''
          safe = {
              'status': status,
              'ok': payload.get('ok'),
              'code': payload.get('code'),
              'model': payload.get('model'),
              'message': payload.get('message'),
              'rawJsonPresent': bool(str(raw).strip()),
          }
          print('ALTERNATE_READER')
          print(json.dumps(safe, indent=2, ensure_ascii=False))
          if status != 200 or payload.get('ok') is not True or not str(raw).strip():
              raise SystemExit(f'Alternate reader returned HTTP {status}')
          try:
              parsed = json.loads(raw)
          except Exception as exc:
              raise SystemExit(f'Alternate reader raw output was not JSON: {exc}')
          required = ['amount', 'currency', 'reference', 'transaction_status']
          if not all(key in parsed for key in required):
              raise SystemExit('Alternate reader omitted required extraction keys')
          PY

      - name: Summarize diagnosis
        if: always()
        shell: bash
        run: |
          echo "Production reader HTTP: ${{ steps.production.outputs.status || 'unknown' }}"
          echo "Alternate reader HTTP: ${{ steps.proxy.outputs.status || 'unknown' }}"
