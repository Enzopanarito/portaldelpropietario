name: Restore Known Good Deploy

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Verify immutable deploy before restoration
        env:
          TARGET: https://6a6fb60be9396d08385ca58e--villalosapamates.netlify.app/.netlify/functions/public-data?force=1
        run: |
          set -euo pipefail
          curl --silent --show-error --location --max-time 60 --output body.json "$TARGET"
          python - <<'PY'
          import json
          from pathlib import Path
          body=json.loads(Path('body.json').read_text(errors='replace') or '{}')
          owners=body.get('propietarios') or []
          houses=sorted({int(o.get('Casa')) for o in owners if str(o.get('Casa','')).isdigit()})
          print('OWNER_COUNT=',len(owners),'HOUSES=',houses,'ENGINE=',body.get('balanceEngineVersion'),'SOURCE=',body.get('officialBalanceSource'))
          if len(owners)!=15 or houses!=list(range(1,16)): raise SystemExit(1)
          PY

  restore-production:
    needs: probe
    runs-on: ubuntu-latest
    steps:
      - name: Restore verified deploy through Netlify API
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          SITE_ID: 74f4f122-352c-4a3b-aa6f-5937ab99f8d3
          DEPLOY_ID: 6a6fb60be9396d08385ca58e
        run: |
          set -euo pipefail
          test -n "${NETLIFY_AUTH_TOKEN:-}"
          code=$(curl --silent --show-error --location --request POST \
            --header "Authorization: Bearer ${NETLIFY_AUTH_TOKEN}" \
            --header 'Content-Type: application/json' \
            --output restore.json --write-out '%{http_code}' \
            "https://api.netlify.com/api/v1/sites/${SITE_ID}/deploys/${DEPLOY_ID}/restore")
          echo "RESTORE_HTTP=${code}"
          test "$code" -ge 200 -a "$code" -lt 300
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('restore.json').read_text(errors='replace') or '{}')
          print('RESTORED_DEPLOY=',data.get('id'),'STATE=',data.get('state'))
          if data.get('id')!='6a6fb60be9396d08385ca58e': raise SystemExit(1)
          PY

      - name: Verify production alias returns all 15 houses
        env:
          TARGET: https://villalosapamates.netlify.app/.netlify/functions/public-data?force=1
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            code=$(curl --silent --show-error --location --max-time 60 --output body.json --write-out '%{http_code}' "${TARGET}&restore_check=${attempt}") || code=000
            if [ "$code" = 200 ] && python - <<'PY'
          import json
          from pathlib import Path
          body=json.loads(Path('body.json').read_text(errors='replace') or '{}')
          owners=body.get('propietarios') or []
          houses=sorted({int(o.get('Casa')) for o in owners if str(o.get('Casa','')).isdigit()})
          print('OWNER_COUNT=',len(owners),'HOUSES=',houses,'ENGINE=',body.get('balanceEngineVersion'),'SOURCE=',body.get('officialBalanceSource'))
          raise SystemExit(0 if len(owners)==15 and houses==list(range(1,16)) else 1)
          PY
            then echo 'PRODUCTION_RESTORED=YES'; exit 0; fi
            sleep 5
          done
          exit 1

  verify-admin-session:
    needs: restore-production
    runs-on: ubuntu-latest
    steps:
      - name: Log in and verify admin receives all 15 houses
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          TARGET: https://villalosapamates.netlify.app
        run: |
          set -euo pipefail
          test -n "${ADMIN_PASSWORD:-}"
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          base=os.environ['TARGET']
          password=os.environ['ADMIN_PASSWORD']
          req=urllib.request.Request(
              base+'/.netlify/functions/login',
              data=json.dumps({'password':password}).encode(),
              headers={'Content-Type':'application/json'},
              method='POST')
          with urllib.request.urlopen(req, timeout=60) as response:
              login=json.loads(response.read().decode() or '{}')
          token=login.get('token')
          if not login.get('success') or not token:
              raise SystemExit('LOGIN_FAILED')
          req=urllib.request.Request(
              base+'/.netlify/functions/admin-data?force=1',
              headers={'Authorization':'Bearer '+token})
          with urllib.request.urlopen(req, timeout=60) as response:
              data=json.loads(response.read().decode() or '{}')
          owners=data.get('propietarios') or []
          houses=sorted({int(o.get('Casa')) for o in owners if str(o.get('Casa','')).isdigit()})
          print('ADMIN_LOGIN=OK')
          print('ADMIN_OWNER_COUNT=',len(owners))
          print('ADMIN_HOUSES=',houses)
          print('ADMIN_ENGINE=',data.get('balanceEngineVersion'))
          if len(owners)!=15 or houses!=list(range(1,16)):
              raise SystemExit('ADMIN_DATA_INCOMPLETE')
          PY
