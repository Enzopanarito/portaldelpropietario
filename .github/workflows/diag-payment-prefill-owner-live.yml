name: DIAG Payment Prefill Owner Live

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/diag-payment-prefill-owner-live.yml'

permissions:
  contents: read

jobs:
  diagnose-owner-prefill:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Generate realistic large JPEG receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          import base64, json, os
          from PIL import Image, ImageDraw, ImageFont, ImageFilter
          w,h=1800,2400
          bg=Image.effect_noise((w,h),24).convert('RGB').filter(ImageFilter.GaussianBlur(.35))
          d=ImageDraw.Draw(bg)
          d.rounded_rectangle((140,180,w-140,h-180),radius=44,fill=(248,248,246),outline=(210,210,205),width=5)
          f=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf',72)
          s=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf',60)
          b=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf',82)
          lines=[('PAGO MOVIL COMPLETADO',b),('Banco de Venezuela',f),('Monto: Bs. 12.345,67',f),('Fecha: 04/08/2026',f),('Hora: 10:30 AM',s),('Referencia: 987654321012',s),('Estado: COMPLETADO',f),('Receptor: Villa Los Apamates',s),('Telefono: 0412-0000000',s)]
          y=330
          for text,font in lines:
              d.text((260,y),text,fill=(20,25,30),font=font); y+=185
          d.text((260,h-410),'Comprobante de prueba CI - NO ES UN PAGO REAL',fill=(75,75,75),font=s)
          image=bg.rotate(.7,resample=Image.Resampling.BICUBIC,expand=False,fillcolor=(32,34,36))
          image.save('owner-diagnostic.jpeg',quality=94,optimize=True)
          content=open('owner-diagnostic.jpeg','rb').read()
          payload={'ownerId':'recgTGvQXCRHEGL1m','attachment':{'name':'owner-diagnostic.jpeg','type':'image/jpeg','size':len(content),'base64':base64.b64encode(content).decode('ascii')}}
          open('request.json','w').write(json.dumps(payload))
          print('BYTES='+str(len(content)))
          PY

      - name: Call canonical production prefill for real owner scope
        shell: bash
        run: |
          set -euo pipefail
          started=$(date +%s)
          status=$(curl --silent --show-error --location --max-time 90 \
            --output response.json \
            --write-out '%{http_code}' \
            --request POST 'https://villalosapamates.netlify.app/api/vla/payment-proof-prefill' \
            --header 'Content-Type: application/json' \
            --data-binary @request.json)
          elapsed=$(( $(date +%s) - started ))
          python3 - "$status" "$elapsed" <<'PY'
          import json,sys
          status=int(sys.argv[1]); elapsed=int(sys.argv[2])
          try: payload=json.load(open('response.json'))
          except Exception: payload={}
          analysis=payload.get('analysis') or {}
          safe={
            'status':status,
            'elapsedSeconds':elapsed,
            'success':payload.get('success'),
            'complete':payload.get('complete'),
            'reason':payload.get('reason'),
            'failureClass':payload.get('failureClass'),
            'providerStatus':payload.get('providerStatus'),
            'analysisProvider':payload.get('analysisProvider'),
            'message':payload.get('message'),
            'currency':analysis.get('currency'),
            'amount':analysis.get('amount'),
            'referencePresent':bool(analysis.get('reference')),
          }
          print(json.dumps(safe,indent=2,ensure_ascii=False))
          PY
