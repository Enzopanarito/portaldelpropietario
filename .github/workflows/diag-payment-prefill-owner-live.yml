name: DIAG Payment Prefill Owner Live

on:
  push:
    branches:
      - diag/payment-prefill-owner-enzo-20260824
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/diag-payment-prefill-owner-live.yml'

permissions:
  contents: read

jobs:
  diagnose-owner-prefill:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Generate synthetic receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          import base64, json
          from PIL import Image, ImageDraw, ImageFont
          image=Image.new('RGB',(1000,850),'white')
          draw=ImageDraw.Draw(image)
          font=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf',42)
          title=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf',50)
          lines=[('PAGO MOVIL COMPLETADO',title),('Banco de Venezuela',font),('Monto: Bs. 12.345,67',font),('Fecha: 04/08/2026',font),('Referencia: 987654321012',font),('Estado: COMPLETADO',font),('Receptor: Villa Los Apamates',font)]
          y=80
          for text,f in lines:
              draw.text((70,y),text,fill='black',font=f); y+=100
          image.save('owner-diagnostic.png',optimize=True)
          content=open('owner-diagnostic.png','rb').read()
          payload={'ownerId':'recgTGvQXCRHEGL1m','attachment':{'name':'owner-diagnostic.png','type':'image/png','size':len(content),'base64':base64.b64encode(content).decode('ascii')}}
          open('request.json','w').write(json.dumps(payload))
          print('BYTES='+str(len(content)))
          PY

      - name: Call canonical production prefill for real owner scope
        shell: bash
        run: |
          set -euo pipefail
          started=$(date +%s)
          status=$(curl --silent --show-error --location --max-time 90 \
            --output response.json \
            --write-out '%{http_code}' \
            --request POST 'https://villalosapamates.netlify.app/api/vla/payment-proof-prefill' \
            --header 'Content-Type: application/json' \
            --data-binary @request.json)
          elapsed=$(( $(date +%s) - started ))
          python3 - "$status" "$elapsed" <<'PY'
          import json,sys
          status=int(sys.argv[1]); elapsed=int(sys.argv[2])
          try: payload=json.load(open('response.json'))
          except Exception: payload={}
          analysis=payload.get('analysis') or {}
          safe={
            'status':status,
            'elapsedSeconds':elapsed,
            'success':payload.get('success'),
            'complete':payload.get('complete'),
            'reason':payload.get('reason'),
            'failureClass':payload.get('failureClass'),
            'providerStatus':payload.get('providerStatus'),
            'analysisProvider':payload.get('analysisProvider'),
            'message':payload.get('message'),
            'currency':analysis.get('currency'),
            'amount':analysis.get('amount'),
            'referencePresent':bool(analysis.get('reference')),
          }
          print(json.dumps(safe,indent=2,ensure_ascii=False))
          PY
