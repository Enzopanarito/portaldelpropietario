name: Audit Punctuality Live Production

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit-punctuality-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install browser dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Audit all 15 production punctuality scores
        env:
          TARGET_URL: https://villalosapamates.netlify.app
        shell: bash
        run: |
          set -euo pipefail
          node tests/owner-punctuality-production-audit.cjs

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: punctuality-live-production-audit
          path: |
            owner-punctuality-production-audit.json
            owner-punctuality-production-audit-error.txt
          if-no-files-found: ignore
          retention-days: 7
