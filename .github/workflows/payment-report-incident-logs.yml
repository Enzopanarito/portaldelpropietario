name: Payment Report Incident Logs

on:
  push:
    branches:
      - audit/payment-report-incident-20260827

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      NETLIFY_CLI_VERSION: '27.1.2'
    steps:
      - name: Read production payment prefill logs only
        shell: bash
        run: |
          set -euo pipefail
          test -n "${NETLIFY_AUTH_TOKEN:-}" || { echo 'NETLIFY_AUTH_TOKEN missing'; exit 1; }
          test -n "${NETLIFY_SITE_ID:-}" || { echo 'NETLIFY_SITE_ID missing'; exit 1; }
          raw="${RUNNER_TEMP}/netlify-payment-prefill.jsonl"
          timeout 25s npx --yes "netlify-cli@${NETLIFY_CLI_VERSION}" logs \
            --json \
            --source functions \
            --since '2026-08-29T02:00:00Z' > "$raw" || code=$?
          if [ "${code:-0}" -ne 0 ] && [ "${code:-0}" -ne 124 ]; then exit "$code"; fi
          node - "$raw" <<'NODE'
          const fs=require('fs');
          const path=process.argv[2];
          const needles=[
            'payment-proof-prefill',
            'Prelectura de comprobante',
            'AI_PROVIDER_ERROR','TIMEOUT','INVALID_ATTACHMENT',
            'RATE_LIMIT','PROVIDER_UNAVAILABLE','LOW_QUALITY_OUTPUT'
          ];
          const lines=fs.readFileSync(path,'utf8').split(/\r?\n/).filter(Boolean);
          const selected=lines.filter(line=>needles.some(needle=>line.includes(needle)));
          console.log(`NETLIFY_LOG_LINES_TOTAL=${lines.length}`);
          console.log(`NETLIFY_LOG_LINES_SELECTED=${selected.length}`);
          for(const line of selected) console.log(line.slice(0,4000));
          NODE

# read-only rerun 2026-08-29T02:35Z
