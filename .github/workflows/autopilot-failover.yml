name: VLA Autopilot Failover

on:
  schedule:
    - cron: '12 4 1-3 * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Modo de ejecución manual'
        required: true
        default: probe
        type: choice
        options:
          - probe
          - dispatch

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: vla-autopilot-failover
  cancel-in-progress: false

jobs:
  failover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_URL: https://villalosapamates.netlify.app
      ALERT_TITLE: '🚨 VLA Autopilot failover: atención requerida'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Select safe failover mode
        id: mode
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ]; then
            mode=dispatch
          else
            mode="${{ inputs.mode }}"
          fi
          case "$mode" in
            probe|dispatch) ;;
            *) echo "Modo no permitido: $mode"; exit 1 ;;
          esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "VLA failover mode: $mode"

      - name: Request short-lived GitHub OIDC identity
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=vla-autopilot-failover")"
          token="$(printf '%s' "$response" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);process.stdout.write(String(j.value||''))})")"
          test -n "$token"
          echo "::add-mask::$token"
          echo "VLA_AUTOPILOT_OIDC_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Trigger protected autopilot failover
        shell: bash
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -euo pipefail
          request="${RUNNER_TEMP}/autopilot-failover-request.json"
          response="${RUNNER_TEMP}/autopilot-failover-response.json"
          MODE="$MODE" node - "$request" <<'NODE'
          const fs=require('fs');
          fs.writeFileSync(process.argv[2],JSON.stringify({
            oidcToken:process.env.VLA_AUTOPILOT_OIDC_TOKEN,
            mode:process.env.MODE
          }));
          NODE
          code="$(curl --silent --show-error --location \
            --request POST \
            --header 'Content-Type: application/json' \
            --data-binary @"$request" \
            --output "$response" \
            --write-out '%{http_code}' \
            --max-time 60 \
            "${TARGET_URL}/.netlify/functions/autopilot-failover-ci")"
          rm -f "$request"
          cat "$response"
          if [ "$MODE" = "probe" ]; then expected=200; else expected=202; fi
          if [ "$code" != "$expected" ]; then
            echo "Failover devolvió HTTP $code; esperado $expected."
            exit 1
          fi

      - name: Close failover incident after successful recovery
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title | jq -r --arg title "$ALERT_TITLE" '.[] | select(.title == $title) | .number' | head -1)"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "✅ El canal externo del piloto volvió a responder correctamente el $(date -u +'%Y-%m-%dT%H:%M:%SZ')."
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY" --reason completed
          fi

      - name: Open one failover incident on failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title | jq -r --arg title "$ALERT_TITLE" '.[] | select(.title == $title) | .number' | head -1)"
          body="El canal externo de respaldo del piloto automático de VLA falló. No se ejecuta ninguna lógica financiera alternativa: el sistema conserva el cierre canónico fail-closed.\n\n- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\n- Detectado: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          if [ -z "$existing" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$ALERT_TITLE" --body "$body"
          else
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          fi
