name: Corregir envío de reportes de pago

on:
  push:
    paths:
      - .github/workflows/payment-submit-hotfix.yml

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Aplicar corrección del formulario
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('owner-payment-report-v3.js')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: se esperaba 1 coincidencia y se encontraron {count}')
              text = text.replace(old, new, 1)

          replace_once(
              "  const MAX_FILE_BYTES=3*1024*1024;\n",
              "  const MAX_FILE_BYTES=3*1024*1024;\n  const ANALYSIS_TARGET_BYTES=900*1024;\n  const ANALYSIS_MAX_DIMENSION=1600;\n  const ANALYSIS_TIMEOUT_MS=22000;\n  const SUBMIT_TIMEOUT_MS=60000;\n",
              'constantes de rendimiento'
          )
          replace_once(
              "  let selectedFile=null,analysisController=null,analyzing=false,manualMode=false,submissionId='';",
              "  let selectedFile=null,analysisController=null,analyzing=false,manualMode=false,submissionId='',submitting=false;",
              'estado de envío'
          )
          replace_once(
              '<button id="submitReport" type="submit" class="vla-pay-submit" disabled>Enviar reporte</button>',
              '<button id="submitReport" type="submit" class="vla-pay-submit">Enviar reporte</button>',
              'botón inicialmente habilitado'
          )

          helper_marker = "\n\n  function scanMessage(kind,title,text)"
          if text.count(helper_marker) != 1:
              raise SystemExit('No se encontró el punto de inserción de la optimización de imagen.')
          helpers = r'''

  function loadImageForAnalysis(file){
    return new Promise((resolve,reject)=>{const url=URL.createObjectURL(file),image=new Image();image.onload=()=>{URL.revokeObjectURL(url);resolve(image)};image.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('No se pudo optimizar la imagen.'))};image.src=url});
  }
  async function compactForAnalysis(file){
    if(!file||!['image/jpeg','image/png'].includes(file.type)||file.size<=ANALYSIS_TARGET_BYTES)return file;
    try{
      const image=await loadImageForAnalysis(file),width=number(image.naturalWidth||image.width),height=number(image.naturalHeight||image.height);if(!(width>0&&height>0))return file;
      const scale=Math.min(1,ANALYSIS_MAX_DIMENSION/Math.max(width,height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(width*scale));canvas.height=Math.max(1,Math.round(height*scale));
      const context=canvas.getContext('2d',{alpha:false});if(!context)return file;context.fillStyle='#fff';context.fillRect(0,0,canvas.width,canvas.height);context.drawImage(image,0,0,canvas.width,canvas.height);
      const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',0.8));if(!blob||blob.size>=file.size)return file;
      const name=String(file.name||'comprobante').replace(/\.(png|jpe?g)$/i,'')+'-lectura.jpg';return new File([blob],name,{type:'image/jpeg',lastModified:Date.now()});
    }catch(_){return file}
  }'''
          text = text.replace(helper_marker, helpers + helper_marker, 1)

          analyze_pattern = re.compile(r"  async function analyzeProof\(\)\{.*?\n  \}\n\n  function enableManual", re.S)
          analyze_replacement = r'''  async function analyzeProof(){
    if(!selectedFile||submitting)return;manualMode=false;analyzing=true;showDetails(true);byId('vla-pay-manual').disabled=false;scanMessage('loading','Leyendo comprobante…','Optimizando la imagen y buscando moneda, monto, banco, referencia, fecha y estado.');validateForm();
    if(analysisController)analysisController.abort();analysisController=new AbortController();const timer=setTimeout(()=>analysisController.abort(),ANALYSIS_TIMEOUT_MS);
    try{
      const optimized=await compactForAnalysis(selectedFile),attachment=await fileToPayload(optimized),response=await fetch('/api/vla/payment-proof-prefill',{method:'POST',headers:{'Content-Type':'application/json'},signal:analysisController.signal,body:JSON.stringify({ownerId:currentOwner.id,attachment})}),data=await response.json().catch(()=>({}));
      if(!response.ok)throw Object.assign(new Error(data.message||'No se pudo leer automáticamente.'),{manualAvailable:data.manualAvailable!==false});fillFromAnalysis(data);
    }catch(error){if(error.name==='AbortError')scanMessage('warn','La lectura tardó demasiado','Puedes completar los datos manualmente; el comprobante se verificará igualmente después del envío.');else scanMessage('warn','Completa los datos manualmente',error.message||'La lectura automática no estuvo disponible.');manualMode=true}
    finally{clearTimeout(timer);analyzing=false;analysisController=null;validateForm()}
  }

  function enableManual'''
          text, count = analyze_pattern.subn(analyze_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'analyzeProof: se reemplazaron {count} bloques')

          bcv_guard = "if((byId('payMode').value==='Bs BCV'||byId('payCurrency').value==='BS')&&!fxRate())items.push({id:'',label:'tasa BCV disponible'});"
          if text.count(bcv_guard) != 1:
              raise SystemExit('No se encontró el bloqueo incorrecto de la tasa BCV.')
          text = text.replace(bcv_guard, '', 1)

          replace_once(
              "    submit.disabled=missing.length>0;return missing;",
              "    submit.disabled=submitting;submit.setAttribute('aria-disabled',missing.length?'true':'false');submit.setAttribute('aria-busy',submitting?'true':'false');submit.style.opacity=missing.length&&!submitting?'.78':'1';submit.title=missing.length?'Toca para ver qué dato falta':'';return missing;",
              'retroalimentación del botón'
          )
          replace_once(
              "selectedFile=null;submissionId=newSubmissionId();manualMode=false;analyzing=false;if(analysisController)",
              "selectedFile=null;submissionId=newSubmissionId();manualMode=false;analyzing=false;submitting=false;if(analysisController)",
              'reinicio del estado de envío'
          )
          replace_once(
              "selectedFile=null;analyzing=false;manualMode=false}",
              "selectedFile=null;analyzing=false;manualMode=false;submitting=false}",
              'cierre del formulario'
          )

          submit_pattern = re.compile(r"  async function submitSmartReport\(event\)\{.*?\n  \}\n\n  function bindButtons", re.S)
          submit_replacement = r'''  async function submitSmartReport(event){
    event.preventDefault();if(submitting)return;const missing=validateForm();
    if(missing.length){const box=byId('vla-pay-validation');box.className='vla-pay-validation warn';box.innerHTML=`<b>No se puede enviar todavía</b><span>${safeText(missing.map(item=>item.label).join(' · '))}</span>`;box.scrollIntoView({behavior:'smooth',block:'center'});if(typeof toast==='function')toast('Revisa los datos señalados antes de enviar.',true);const first=missing.find(item=>item.id&&byId(item.id));if(first)setTimeout(()=>byId(first.id).focus(),250);return}
    submitting=true;const submit=byId('submitReport'),box=byId('vla-pay-validation');submit.disabled=true;submit.textContent='Enviando…';submit.setAttribute('aria-busy','true');box.className='vla-pay-validation ok';box.innerHTML='<b>Enviando y protegiendo el comprobante…</b><span>No cierres esta ventana. Recibirás una confirmación clara.</span>';box.scrollIntoView({behavior:'smooth',block:'center'});
    const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),SUBMIT_TIMEOUT_MS),slowNotice=setTimeout(()=>{if(submitting){box.className='vla-pay-validation ok';box.innerHTML='<b>Seguimos procesando el reporte…</b><span>Estamos verificando duplicados y guardando el comprobante de forma segura.</span>'}},9000);
    try{
      const amount=enteredAmount(),enteredCurrency=byId('payCurrency').value,mode=byId('payMode').value,channel=paymentChannel(),attachment=channel==='DIGITAL'?await fileToPayload(selectedFile):null,payload={ownerId:currentOwner.id,submissionId,mode,amount,enteredCurrency,paymentChannel:channel,reference:byId('payRef').value.trim(),rate:fxRate(),bank:channel==='DIGITAL'?byId('payBank').value.trim():'Efectivo',cashReceiver:channel==='CASH'?byId('payCashReceiver').value.trim():'',transactionDate:byId('payTransactionDate').value,transactionStatus:channel==='CASH'?'COMPLETED':byId('payTransactionStatus').value,observations:byId('payNotes').value.trim(),attachment};
      const response=await fetch('/api/vla/report-payment',{method:'POST',headers:{'Content-Type':'application/json'},signal:controller.signal,body:JSON.stringify(payload)}),data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.message||data.detail||'Error reportando pago.');hideSmartModal();if(typeof toast==='function')toast(data.message||'Reporte recibido y enviado al motor de validación.',false);
    }catch(error){const message=error.name==='AbortError'?'No recibimos confirmación a tiempo. Pulsa nuevamente “Enviar reporte” con el mismo comprobante; el sistema evitará duplicados.':(error.message||'Revise los datos e intente nuevamente.');box.className='vla-pay-validation warn';box.innerHTML=`<b>No se confirmó el envío</b><span>${safeText(message)}</span>`;box.scrollIntoView({behavior:'smooth',block:'center'});if(typeof toast==='function')toast('El reporte no quedó confirmado. Revisa el mensaje mostrado.',true)}
    finally{clearTimeout(timeout);clearTimeout(slowNotice);submitting=false;submit.textContent='Enviar reporte';submit.removeAttribute('aria-busy');if(!byId('modal').classList.contains('hidden'))validateForm()}
  }

  function bindButtons'''
          text, count = submit_pattern.subn(submit_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'submitSmartReport: se reemplazaron {count} bloques')

          text = text.replace("smart-v5'", "smart-v6'", 1)
          path.write_text(text, encoding='utf-8')

          edge = Path('netlify/edge-functions/owner-mobile-assets.js')
          edge_text = edge.read_text(encoding='utf-8')
          edge_text = edge_text.replace('owner-mobile-fluid-v2-payment-smart-v5-dark-wcag-v1-r3-2026-08-03','owner-mobile-fluid-v2-payment-smart-v6-submit-r1-2026-08-03')
          edge_text = edge_text.replace('content="smart-v5"','content="smart-v6"')
          edge_text = edge_text.replace("'smart-v5'", "'smart-v6'")
          edge.write_text(edge_text, encoding='utf-8')
          PY

      - name: Verificar sintaxis y pruebas
        run: |
          node --check owner-payment-report-v3.js
          node --check netlify/edge-functions/owner-mobile-assets.js
          npm ci --ignore-scripts
          npm test
          npm run build

      - name: Publicar corrección verificada
        run: |
          git config user.name "VLA Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add owner-payment-report-v3.js netlify/edge-functions/owner-mobile-assets.js
          git commit -m "Corregir envío silencioso y agilizar lectura de comprobantes"
          git push origin HEAD:main
