name: Diagnose production login PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call production login with diagnostic placeholder
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl -sS -w '\nHTTP_STATUS:%{http_code}\n' \
            -X POST 'https://villalosapamates.netlify.app/.netlify/functions/login' \
            -H 'content-type: application/json' \
            --data '{"password":"diagnostic-placeholder-do-not-use"}')
          printf '%s\n' "$response"
