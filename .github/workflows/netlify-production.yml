name: Deploy Netlify Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NETLIFY_AUTH_TOKEN_PRIMARY: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_AUTH_TOKEN_FALLBACK: ${{ secrets.NETLIFY_TOKEN }}
      NETLIFY_SITE_ID_PRIMARY: ${{ secrets.NETLIFY_SITE_ID }}
      NETLIFY_SITE_ID_FALLBACK: ${{ secrets.NETLIFY_SITE_ID_VILLALOSAPAMATES }}
      AWS_LAMBDA_JS_RUNTIME: nodejs22.x
    steps:
      - name: Checkout exact production commit
        uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install dependencies safely
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run financial, payment, snapshot, close and security release gates
        run: npm test

      - name: Resolve canonical publish directory
        id: release
        shell: bash
        run: |
          set -euo pipefail
          publish_dir="$(node -e "const r=require('./release.json');const d=String(r.productionPublishDirectory||'').trim();if(!d)process.exit(1);process.stdout.write(d)")"
          echo "publish_dir=$publish_dir" >> "$GITHUB_OUTPUT"

      - name: Build the exact production artifact in GitHub
        env:
          CONTEXT: production
          VLA_DATA_ENVIRONMENT: production
        run: npm run build:public

      - name: Install Chromium for critical browser gates
        run: npx playwright install --with-deps chromium

      - name: Run critical payment and admin browser gates
        run: node --test tests/owner-payment-report-browser.cjs tests/payment-duplicate-feedback-browser.cjs tests/admin-owner-access-browser.cjs tests/admin-premium-browser.cjs tests/admin-responsive-fouc-browser.cjs

      - name: Resolve Netlify credentials safely
        id: credentials
        shell: bash
        run: |
          set -euo pipefail
          AUTH_TOKEN="${NETLIFY_AUTH_TOKEN_PRIMARY:-${NETLIFY_AUTH_TOKEN_FALLBACK:-}}"
          SITE_ID="${NETLIFY_SITE_ID_PRIMARY:-${NETLIFY_SITE_ID_FALLBACK:-}}"
          if [ -n "$AUTH_TOKEN" ]; then echo "::add-mask::$AUTH_TOKEN"; fi
          if [ -n "$SITE_ID" ]; then echo "::add-mask::$SITE_ID"; fi
          if [ -z "$AUTH_TOKEN" ] || [ -z "$SITE_ID" ]; then
            echo "Faltan credenciales Netlify. Producción no será modificada."
            exit 1
          fi
          echo "NETLIFY_AUTH_TOKEN=$AUTH_TOKEN" >> "$GITHUB_ENV"
          echo "NETLIFY_SITE_ID=$SITE_ID" >> "$GITHUB_ENV"

      - name: Inspect Netlify production configuration
        id: site
        shell: bash
        run: |
          set -euo pipefail
          site_json="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            -H "User-Agent: VLA-GitHub-Actions" \
            "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID")"
          production_branch="$(printf '%s' "$site_json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);process.stdout.write(String(j.build_settings?.repo_branch||j.repo?.branch||'unknown'))})")"
          [ "$production_branch" = "main" ] || { echo "La rama de producción es $production_branch, no main."; exit 1; }
          echo "production_branch=$production_branch" >> "$GITHUB_OUTPUT"
          echo "Production branch: $production_branch"

      - name: Capture immediate BEFORE financial baseline
        id: before
        shell: bash
        run: |
          set -euo pipefail
          before="${RUNNER_TEMP}/vla-before.json"
          curl --fail-with-body --silent --show-error --location --max-time 60 \
            "https://villalosapamates.netlify.app/api/vla/public-data?force=1&before=${GITHUB_SHA}-${GITHUB_RUN_ID}" \
            --output "$before"
          node - "$before" <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const owners=Array.isArray(data.propietarios)?data.propietarios:[];
          if(owners.length!==15)throw new Error(`BEFORE devolvió ${owners.length}/15 casas.`);
          for(let casa=1;casa<=15;casa++)if(!owners.some(owner=>Number(owner.Casa)===casa))throw new Error(`BEFORE no contiene Casa ${casa}.`);
          console.log('BEFORE_FINANCIAL_BASELINE_OK 15/15');
          NODE
          echo "path=$before" >> "$GITHUB_OUTPUT"

      - name: Upload prepared production deploy without hosted build
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          output="${RUNNER_TEMP}/netlify-cli-production.json"
          npx --yes netlify-cli@latest deploy \
            --prod \
            --no-build \
            --dir="${{ steps.release.outputs.publish_dir }}" \
            --functions=netlify/functions \
            --site="$NETLIFY_SITE_ID" \
            --auth="$NETLIFY_AUTH_TOKEN" \
            --skip-functions-cache \
            --message="VLA production commit=${GITHUB_SHA}" \
            --json > "$output"
          cat "$output"
          node - "$output" "$GITHUB_OUTPUT" <<'NODE'
          const fs=require('fs');
          const [file,out]=process.argv.slice(2);
          const data=JSON.parse(fs.readFileSync(file,'utf8'));
          const id=String(data.deploy_id||data.id||'');
          if(!id)throw new Error('Netlify CLI no devolvió deploy_id.');
          fs.appendFileSync(out,`deploy_id=${id}\n`);
          NODE

      - name: Verify production deploy metadata, exact commit, Node 22 runtime and canonical release contract
        id: verify
        env:
          DEPLOY_ID: ${{ steps.deploy.outputs.deploy_id }}
        shell: bash
        run: |
          set -euo pipefail
          deploy_file="${RUNNER_TEMP}/vla-production-deploy.json"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            -H "User-Agent: VLA-GitHub-Actions" \
            "https://api.netlify.com/api/v1/deploys/$DEPLOY_ID" \
            --output "$deploy_file"
          node - "$deploy_file" <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(d.state!=='ready')throw new Error('Deploy state='+d.state);
          if(d.context!=='production')throw new Error('Deploy context='+d.context);
          const expected=String(process.env.GITHUB_SHA||'');
          const commitRef=String(d.commit_ref||'').trim();
          const title=String(d.title||'');
          const titleCommit=(/^VLA production commit=([0-9a-f]{40})$/i.exec(title)||[])[1]||'';
          if(commitRef!==expected&&titleCommit!==expected)throw new Error(`Deploy no corresponde al commit exacto: commit_ref=${commitRef||'none'} titleCommit=${titleCommit||'none'} expected=${expected}`);
          const functions=Array.isArray(d.available_functions)?d.available_functions:[];
          if(!functions.length)throw new Error('Netlify no reportó Functions desplegadas.');
          const runtimes=[...new Set(functions.map(fn=>String(fn.r||fn.runtime||'unknown')))];
          if(runtimes.length!==1||runtimes[0]!=='nodejs22.x')throw new Error(`Runtime Functions inesperado: ${runtimes.join(', ')}`);
          console.log(JSON.stringify({id:d.id,state:d.state,context:d.context,commit_ref:commitRef||null,verifiedCommit:expected,functions:functions.length,runtime:runtimes[0],title},null,2));
          NODE
          production_release="${RUNNER_TEMP}/vla-production-release.json"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --location --max-time 30 \
              "https://villalosapamates.netlify.app/release.json?commit=$GITHUB_SHA&attempt=$attempt" \
              --output "$production_release" \
              && node scripts/verify-release-contract.js release.json "$production_release"; then
              echo "deploy_id=$DEPLOY_ID" >> "$GITHUB_OUTPUT"
              echo "Canonical production release, exact commit and Node 22 runtime verified for $GITHUB_SHA."
              exit 0
            fi
            sleep 5
          done
          echo "Producción no expuso el contrato canónico esperado."
          exit 1

      - name: Compare AFTER against immediate BEFORE in exact cents
        id: finance
        env:
          BEFORE_PATH: ${{ steps.before.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail
          after="${RUNNER_TEMP}/vla-after.json"
          curl --fail-with-body --silent --show-error --location --max-time 60 \
            "https://villalosapamates.netlify.app/api/vla/public-data?force=1&after=${GITHUB_SHA}-${GITHUB_RUN_ID}" \
            --output "$after"
          node - "$BEFORE_PATH" "$after" <<'NODE'
          const fs=require('fs');
          const [beforePath,afterPath]=process.argv.slice(2);
          const fields=['saldoUsd','saldoBsRef','totalPagadero','saldoNetoReferencial','saldoFavorUsd','saldoFavorBs','deudaVencidaUsd','deudaVencidaBs','mesCorrienteUsd','mesCorrienteBs'];
          const money=value=>Math.round((Number(value)||0)*100);
          const load=path=>{const data=JSON.parse(fs.readFileSync(path,'utf8'));const owners=Array.isArray(data.propietarios)?data.propietarios:[];if(owners.length!==15)throw new Error(`${path}: ${owners.length}/15 casas`);return new Map(owners.map(owner=>[Number(owner.Casa),owner]))};
          const before=load(beforePath),after=load(afterPath),diffs=[];
          let absolute=0;
          for(let casa=1;casa<=15;casa++){
            const a=before.get(casa),b=after.get(casa);
            if(!a||!b)throw new Error(`Casa ${casa} ausente en BEFORE/AFTER.`);
            for(const field of fields){const av=money(a[field]),bv=money(b[field]),delta=bv-av;absolute+=Math.abs(delta);if(delta!==0)diffs.push({casa,field,before:av/100,after:bv/100,diff:delta/100});}
          }
          console.log(`FINANCIAL_FIELDS_CHECKED=${15*fields.length}`);
          console.log(`ABSOLUTE_DIFFERENCE=${(absolute/100).toFixed(2)}`);
          if(diffs.length){console.error(JSON.stringify({diffs},null,2));process.exit(1)}
          console.log('FINANCIAL_BEFORE_AFTER_OK 15/15 houses · 150/150 fields · $0.00');
          NODE

      - name: Report deployment result
        if: always()
        shell: bash
        env:
          DEPLOY_ID: ${{ steps.deploy.outputs.deploy_id }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          FINANCE_OUTCOME: ${{ steps.finance.outcome }}
          PRODUCTION_BRANCH: ${{ steps.site.outputs.production_branch }}
        run: |
          if [ "$VERIFY_OUTCOME" = "success" ] && [ "$FINANCE_OUTCOME" = "success" ]; then
            title="Producción publicada y certificada ✅"
            detail="Artefacto construido en GitHub, commit exacto, Functions Node 22, release canónico verificado y BEFORE/AFTER financiero = $0.00."
          else
            title="Producción no certificada ⚠️"
            detail="El despliegue, runtime, contrato canónico o comparación financiera no concluyeron correctamente."
          fi
          {
            echo "### $title"
            echo
            echo "$detail"
            echo
            echo "Rama: \`${PRODUCTION_BRANCH:-unknown}\` · Deploy: \`${DEPLOY_ID:-not-returned}\` · Commit: \`$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
