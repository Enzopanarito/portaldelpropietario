name: Punctuality V3 Live 15 Reconcile Audit

on:
  push:
    branches:
      - audit/punctuality-v3-live-15-reconcile-20260827

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Audit exact production deploy read-only
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const base = 'https://6a9063f588916316a5c17286--villalosapamates.netlify.app';
          const owners = [
            [1,'recSyiBwanGzzUk42'],[2,'recDK2IAorB4mjbp3'],[3,'recbGcb2sjI5ItE33'],
            [4,'recAPrULe1J6m1Sxt'],[5,'recIRW9YDT7P6OHpK'],[6,'recPmcfgGfrtRrLXP'],
            [7,'recEudX0CRFI68WS1'],[8,'recDHPQpoWr3CnM4X'],[9,'recgTGvQXCRHEGL1m'],
            [10,'rec9pzoVmBB5DYeH2'],[11,'recLJ3hwq3HFvAPKQ'],[12,'recX94UnGvU9VRDsu'],
            [13,'recmCUCnMGkaIL3qk'],[14,'rec5z2pY1lFljVjnt'],[15,'recsaXce3Xyt8Z2UI']
          ];
          async function read(casa, ownerId) {
            const url = `${base}/api/vla/punctuality-score?ownerId=${encodeURIComponent(ownerId)}&liveAudit=20260827-reconcile`;
            const response = await fetch(url, {headers:{'User-Agent':'VLA-Punctuality-Reconcile-Audit'}});
            const text = await response.text();
            if (!response.ok) throw new Error(`Casa ${casa}: HTTP ${response.status} ${text.slice(0,200)}`);
            const ro = response.headers.get('x-punctuality-read-only');
            const source = response.headers.get('x-punctuality-source');
            if (ro !== 'true') throw new Error(`Casa ${casa}: X-Punctuality-Read-Only=${ro}`);
            if (!['LEDGER_AUDIT','MEMORY_CACHE'].includes(source)) throw new Error(`Casa ${casa}: source=${source}`);
            const body = JSON.parse(text);
            if (body.readOnly !== true) throw new Error(`Casa ${casa}: body.readOnly inválido`);
            if (body.version !== 'vla-punctuality-v3') throw new Error(`Casa ${casa}: version=${body.version}`);
            if (Number(body.casa) !== casa) throw new Error(`Casa ${casa}: body.casa=${body.casa}`);
            if (String(body.ownerId) !== ownerId) throw new Error(`Casa ${casa}: ownerId no coincide`);
            if (body.commonDuePolicy !== 'MONTH_END') throw new Error(`Casa ${casa}: commonDuePolicy=${body.commonDuePolicy}`);
            if (Number(body.promptPayEndDay) !== 10) throw new Error(`Casa ${casa}: promptPayEndDay=${body.promptPayEndDay}`);
            return {casa, source, body};
          }
          (async()=>{
            const rows=[];
            for (const [casa,id] of owners) rows.push(await read(casa,id));
            console.log('VLA_PUNCTUALITY_V3_LIVE_15_RECONCILE_OK 15/15');
            console.log('CASA | SCORE | BASE | PENALTY | OVERDUE_MONTHS | LEVEL | MONTHS | SOURCE');
            for (const row of rows) {
              const b=row.body, r=b.recurrence||{};
              console.log(`${String(row.casa).padStart(2,'0')} | ${b.score} | ${b.baseScore} | ${Number(r.penalty||0)} | ${Number(r.overdueMonths||0)} | ${b.level?.label||''} | ${b.evaluatedMonths}/${b.targetMonths} | ${row.source}`);
            }
            for (const target of [6,7]) {
              const row=rows.find(x=>x.casa===target), b=row.body;
              console.log(`DETAIL_CASA_${target}=`+JSON.stringify({score:b.score,baseScore:b.baseScore,recurrence:b.recurrence,anchor:b.anchor,history:b.history},null,2));
            }
            const c6=rows.find(x=>x.casa===6).body, c7=rows.find(x=>x.casa===7).body;
            console.log('COMPARE_CASA_6_7='+JSON.stringify({casa6:{score:c6.score,baseScore:c6.baseScore},casa7:{score:c7.score,baseScore:c7.baseScore},scoreDifference:Number(c7.score)-Number(c6.score),baseDifference:Number(c7.baseScore)-Number(c6.baseScore)}));
          })().catch(err=>{console.error(err.stack||String(err));process.exit(1)});
          NODE
