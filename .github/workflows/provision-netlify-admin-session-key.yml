name: Provision Netlify Admin Session Key

on:
  pull_request:
    branches: [main]
    types: [edited]

permissions:
  contents: read

jobs:
  provision:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/vla-10of10-hardening-20260809' &&
      contains(github.event.pull_request.title, '[skip netlify]') &&
      contains(github.event.pull_request.title, '[provision secret]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NETLIFY_AUTH_TOKEN_PRIMARY: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_AUTH_TOKEN_FALLBACK: ${{ secrets.NETLIFY_TOKEN }}
      NETLIFY_SITE_ID_PRIMARY: ${{ secrets.NETLIFY_SITE_ID }}
      NETLIFY_SITE_ID_FALLBACK: ${{ secrets.NETLIFY_SITE_ID_VILLALOSAPAMATES }}
    steps:
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Resolve Netlify credentials without exposing them
        shell: bash
        run: |
          set -euo pipefail
          AUTH_TOKEN="${NETLIFY_AUTH_TOKEN_PRIMARY:-${NETLIFY_AUTH_TOKEN_FALLBACK:-}}"
          SITE_ID="${NETLIFY_SITE_ID_PRIMARY:-${NETLIFY_SITE_ID_FALLBACK:-}}"
          [ -n "$AUTH_TOKEN" ] || { echo 'Falta token Netlify.'; exit 1; }
          [ -n "$SITE_ID" ] || { echo 'Falta Site ID Netlify.'; exit 1; }
          echo "::add-mask::$AUTH_TOKEN"
          echo "::add-mask::$SITE_ID"
          echo "NETLIFY_AUTH_TOKEN=$AUTH_TOKEN" >> "$GITHUB_ENV"
          echo "NETLIFY_SITE_ID=$SITE_ID" >> "$GITHUB_ENV"

      - name: Generate and store dedicated production signing root through Netlify API
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto=require('crypto');
          const token=process.env.NETLIFY_AUTH_TOKEN;
          const siteId=process.env.NETLIFY_SITE_ID;
          const api='https://api.netlify.com/api/v1';
          const key='ADMIN_SESSION_SIGNING_KEY';
          const headers={Authorization:`Bearer ${token}`,'Content-Type':'application/json','User-Agent':'VLA-secret-provisioning'};
          async function parse(response,label,allow404=false){
            const body=await response.json().catch(()=>({}));
            if(allow404&&response.status===404)return null;
            if(!response.ok)throw new Error(`${label} respondió HTTP ${response.status}.`);
            return body;
          }
          (async()=>{
            const site=await parse(await fetch(`${api}/sites/${encodeURIComponent(siteId)}`,{headers}), 'Netlify site');
            const accountId=String(site.account_id||site.account_slug||'').trim();
            if(!accountId)throw new Error('Netlify no devolvió account_id para el sitio.');
            const endpoint=`${api}/accounts/${encodeURIComponent(accountId)}/env/${encodeURIComponent(key)}?site_id=${encodeURIComponent(siteId)}`;
            const existing=await parse(await fetch(endpoint,{headers}),`Lectura ${key}`,true);
            if(existing){
              if(existing.is_secret!==true)throw new Error(`${key} ya existe pero no está marcada como secret; se abortó sin sobrescribirla.`);
              const contexts=(existing.values||[]).map(item=>item.context);
              if(!contexts.includes('production')||!(existing.scopes||[]).includes('functions'))throw new Error(`${key} existe pero no tiene contexto production + scope functions.`);
              console.log('ADMIN_SESSION_SIGNING_KEY ya estaba aprovisionada correctamente.');
              return;
            }
            const secret=crypto.randomBytes(48).toString('hex');
            if(secret.length!==96)throw new Error('No se pudo generar una raíz fuerte.');
            const createEndpoint=`${api}/accounts/${encodeURIComponent(accountId)}/env?site_id=${encodeURIComponent(siteId)}`;
            const payload=[{key,scopes:['functions'],values:[{value:secret,context:'production'}],is_secret:true}];
            await parse(await fetch(createEndpoint,{method:'POST',headers,body:JSON.stringify(payload)}),`Creación ${key}`);
            secret.replace(/./g,'0');
            const verified=await parse(await fetch(endpoint,{headers}),`Verificación ${key}`);
            const contexts=(verified.values||[]).map(item=>item.context);
            if(verified.is_secret!==true||!(verified.scopes||[]).includes('functions')||!contexts.includes('production'))throw new Error(`${key} no quedó con metadata segura.`);
            console.log('ADMIN_SESSION_SIGNING_KEY dedicada creada y verificada sin leer su valor.');
          })().catch(error=>{console.error(String(error.message||error));process.exit(1)});
          NODE
