name: Verify Owner Mobile

on:
  pull_request:
    branches: [main]
  workflow_run:
    workflows: ["Deploy Netlify Production"]
    types: [completed]

permissions:
  contents: read
  statuses: write

jobs:
  verify-owner-mobile:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Validate static mobile recovery
        run: |
          node tests/owner-mobile-v2.test.js
          node tests/owner-dark-contrast.test.js
          node tests/owner-current-month-v1.test.js

      - name: Validate smart payment report structure
        run: |
          node tests/payment-report-intelligence.test.js
          node tests/payment-report-attachment.test.js
          node tests/owner-payment-report-v3.test.js
          node tests/public-report-payment-smart.test.js

      - name: Resolve target URL
        id: target
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "url=https://deploy-preview-${{ github.event.pull_request.number }}--villalosapamates.netlify.app" >> "$GITHUB_OUTPUT"
          else
            echo "url=https://villalosapamates.netlify.app" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for mobile, payment, plant, dark and current-month assets
        env:
          TARGET_URL: ${{ steps.target.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            html_code="$(curl --silent --show-error --location --output /tmp/owner.html --write-out '%{http_code}' --max-time 30 "${TARGET_URL}/?owner-release=${GITHUB_RUN_ID}-${attempt}" 2>/dev/null || true)"
            mobile_code="$(curl --silent --show-error --location --output /tmp/owner-mobile.css --write-out '%{http_code}' --max-time 30 "${TARGET_URL}/owner-mobile-v2.css?v=${GITHUB_RUN_ID}-${attempt}" 2>/dev/null || true)"
            layout_code="$(curl --silent --show-error --location --output /tmp/owner-layout.css --write-out '%{http_code}' --max-time 30 "${TARGET_URL}/owner-mobile-v2-layout-fix.css?v=${GITHUB_RUN_ID}-${attempt}" 2>/dev/null || true)"
            dark_code="$(curl --silent --show-error --location --output /tmp/owner-dark.css --write-out '%{http_code}' --max-time 30 "${TARGET_URL}/owner-dark-contrast-v1.css?v=${GITHUB_RUN_ID}-${attempt}" 2>/dev/null || true)"
            payment_code="$(curl --silent --show-error --location --output /tmp/owner-payment.js --write-out '%{http_code}' --max-time 30 "${TARGET_URL}/owner-payment-report-v3.js?v=${GITHUB_RUN_ID}-${attempt}" 2>/dev/null || true)"
            current_css_code="$(curl --silent --show-error --location --output /tmp/owner-current-month.css --write-out '%{http_code}' --max-time 30 "${TARGET_URL}/owner-current-month-v1.css?v=${GITHUB_RUN_ID}-${attempt}" 2>/dev/null || true)"
            current_js_code="$(curl --silent --show-error --location --output /tmp/owner-current-month.js --write-out '%{http_code}' --max-time 30 "${TARGET_URL}/owner-current-month-v1.js?v=${GITHUB_RUN_ID}-${attempt}" 2>/dev/null || true)"
            plant_css_code="$(curl --silent --show-error --location --output /tmp/owner-plant.css --write-out '%{http_code}' --max-time 30 "${TARGET_URL}/owner-plant-v1.css?v=${GITHUB_RUN_ID}-${attempt}" 2>/dev/null || true)"
            plant_js_code="$(curl --silent --show-error --location --output /tmp/owner-plant.js --write-out '%{http_code}' --max-time 30 "${TARGET_URL}/owner-plant-v1.js?v=${GITHUB_RUN_ID}-${attempt}" 2>/dev/null || true)"
            if [ "$html_code" = "200" ] && [ "$mobile_code" = "200" ] && [ "$layout_code" = "200" ] && [ "$dark_code" = "200" ] && [ "$payment_code" = "200" ] && [ "$current_css_code" = "200" ] && [ "$current_js_code" = "200" ] && [ "$plant_css_code" = "200" ] && [ "$plant_js_code" = "200" ] \
              && [ -s /tmp/owner-mobile.css ] && [ -s /tmp/owner-layout.css ] && [ -s /tmp/owner-payment.js ] && [ -s /tmp/owner-current-month.css ] && [ -s /tmp/owner-current-month.js ] && [ -s /tmp/owner-plant.css ] && [ -s /tmp/owner-plant.js ] \
              && grep -q 'data-vla-owner-mobile="fluid-v2"' /tmp/owner.html \
              && grep -q 'data-vla-owner-payment-cash="currency-mapped-v1"' /tmp/owner.html \
              && grep -q 'vla-owner-current-month-v1' /tmp/owner.html \
              && grep -q 'vla-owner-plant-v1' /tmp/owner.html \
              && grep -q 'owner-current-month-v1' /tmp/owner-current-month.js \
              && grep -q 'SOLICITAR_CAMBIO_PLANTA' /tmp/owner-plant.js \
              && grep -q 'Contraste integral modo oscuro wcag-v1' /tmp/owner-dark.css; then
              echo "Assets móviles, pago, planta, contraste y cuota corriente disponibles en $TARGET_URL"
              exit 0
            fi
            echo "Attempt $attempt: html=${html_code:-missing} mobile=${mobile_code:-missing} layout=${layout_code:-missing} dark=${dark_code:-missing} payment=${payment_code:-missing} current_css=${current_css_code:-missing} current_js=${current_js_code:-missing} plant_css=${plant_css_code:-missing} plant_js=${plant_js_code:-missing}"
            sleep 10
          done
          echo "Los assets del portal propietario no estuvieron disponibles de forma consistente."
          exit 1

      - name: Install Chromium
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Verify mobile layout without Tailwind CDN
        env:
          TARGET_URL: ${{ steps.target.outputs.url }}
        run: node tests/owner-mobile-browser.cjs

      - name: Verify payment report behavior and readability
        env:
          TARGET_URL: ${{ steps.target.outputs.url }}
        run: node --test tests/owner-payment-report-browser.cjs tests/payment-prefill-client-race-browser.cjs

      - name: Verify dark-mode activation, persistence and runtime contrast
        env:
          TARGET_URL: ${{ steps.target.outputs.url }}
        run: node tests/owner-dark-runtime-browser.cjs

      - name: Upload mobile evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: owner-mobile-evidence
          path: |
            owner-mobile-result.json
            owner-mobile-error.txt
            owner-mobile-*.png
            owner-payment-report-result.json
            owner-payment-report-error.txt
            owner-payment-report-mobile.png
            owner-payment-report-live-casa4.png
            owner-dark-contrast-result.json
            owner-dark-contrast-error.txt
            owner-dark-welcome.png
            owner-dark-portal.png
            owner-dark-payment.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish successful production status
        if: success() && github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state=success \
            -f context='Owner Mobile Production Verification' \
            -f description='Portal móvil, pagos progressive-v8, cuota corriente y modo oscuro verificados.' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Publish failed production status
        if: failure() && github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state=failure \
            -f context='Owner Mobile Production Verification' \
            -f description='Falló la verificación móvil, de cuota corriente, del reporte o del modo oscuro.' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
