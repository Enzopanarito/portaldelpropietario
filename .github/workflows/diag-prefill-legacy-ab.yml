name: DIAG B Legacy Payment Prefill

on:
  pull_request:
    paths:
      - '.github/workflows/diag-prefill-legacy-ab.yml'

permissions:
  contents: read

jobs:
  realistic-prefill-legacy:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Wait for legacy preview
        env:
          TARGET_URL: https://deploy-preview-208--villalosapamates.netlify.app
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            code="$(curl --silent --location --output /tmp/release.json --write-out '%{http_code}' --max-time 15 "${TARGET_URL}/release.json?diag=${GITHUB_RUN_ID}-${attempt}" || true)"
            if [ "$code" = "200" ]; then echo "LEGACY_PREVIEW_READY=$TARGET_URL"; exit 0; fi
            sleep 5
          done
          echo "Preview 208 unavailable" >&2; exit 1

      - name: Generate realistic 920KB-class JPEG receipt
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          import base64,json,os
          from PIL import Image,ImageDraw,ImageFont,ImageFilter
          w,h=1800,2400
          background=Image.effect_noise((w,h),24).convert('RGB').filter(ImageFilter.GaussianBlur(0.35))
          draw=ImageDraw.Draw(background); card=(140,180,w-140,h-180)
          draw.rounded_rectangle(card,radius=44,fill=(248,248,246),outline=(210,210,205),width=5)
          font=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf',72)
          small=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf',60)
          bold=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf',82)
          lines=[('PAGO MOVIL COMPLETADO',bold),('Banco de Venezuela',font),('Monto: Bs. 12.345,67',font),('Fecha: 04/08/2026',font),('Hora: 10:30 AM',small),('Referencia: 987654321012',small),('Estado: COMPLETADO',font),('Receptor: Villa Los Apamates',small),('Telefono: 0412-0000000',small)]
          y=330
          for text,selected in lines: draw.text((260,y),text,fill=(20,25,30),font=selected); y+=185
          draw.text((260,h-410),'Comprobante de prueba CI - NO ES UN PAGO REAL',fill=(75,75,75),font=small)
          image=background.rotate(0.7,resample=Image.Resampling.BICUBIC,expand=False,fillcolor=(32,34,36))
          quality=94
          while True:
              image.save('realistic-payment-proof.jpeg',format='JPEG',quality=quality,optimize=True)
              size=os.path.getsize('realistic-payment-proof.jpeg')
              if 850000 <= size <= 2750000 or quality <= 78: break
              quality-=3
          if size>3*1024*1024: raise SystemExit(f'JPEG too large: {size}')
          content=open('realistic-payment-proof.jpeg','rb').read()
          payload={'ownerId':'recREALPHOTO00001','attachment':{'name':'realistic-payment-proof.jpeg','type':'image/jpeg','size':len(content),'base64':base64.b64encode(content).decode('ascii')}}
          open('realistic-prefill-request.json','w').write(json.dumps(payload))
          print(f'REALISTIC_JPEG_BYTES={len(content)} quality={quality}')
          PY

      - name: Probe legacy preview prefill
        env:
          TARGET_URL: https://deploy-preview-208--villalosapamates.netlify.app/api/vla/payment-proof-prefill
        run: |
          set -euo pipefail
          start_ms="$(date +%s%3N)"
          status="$(curl --silent --show-error --location --output realistic-prefill-response.json --write-out '%{http_code}' --max-time 90 --request POST "$TARGET_URL" --header 'Content-Type: application/json' --data-binary @realistic-prefill-request.json)"
          end_ms="$(date +%s%3N)"; elapsed_ms="$((end_ms-start_ms))"
          python3 - "$status" "$elapsed_ms" <<'PY'
          import json,sys
          status=int(sys.argv[1]); elapsed=int(sys.argv[2])
          try: payload=json.load(open('realistic-prefill-response.json'))
          except Exception: payload={}
          analysis=payload.get('analysis') or {}
          safe={'httpStatus':status,'elapsedMs':elapsed,'success':payload.get('success'),'complete':payload.get('complete'),'reason':payload.get('reason'),'providerStatus':payload.get('providerStatus'),'analysisProvider':payload.get('analysisProvider'),'analysisRoute':payload.get('analysisRoute'),'currency':analysis.get('currency'),'amount':analysis.get('amount'),'referencePresent':bool(analysis.get('reference'))}
          print(json.dumps(safe,indent=2,ensure_ascii=False))
          if status!=200 or payload.get('success') is not True: raise SystemExit(f'LEGACY_STACK_FAILED_HTTP_{status}')
          if analysis.get('currency')!='VES' or abs(float(analysis.get('amount') or 0)-12345.67)>0.01 or not analysis.get('reference'): raise SystemExit('LEGACY_STACK_INCOMPLETE_EXTRACTION')
          PY
