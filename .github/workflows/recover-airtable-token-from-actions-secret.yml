name: Recover Airtable Token From Actions Secret

on:
  push:
    branches: [agent/vla-airtable-token-recovery-probe]

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_API_TOKEN }}
      NETLIFY_AUTH_TOKEN_PRIMARY: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_AUTH_TOKEN_FALLBACK: ${{ secrets.NETLIFY_TOKEN }}
      NETLIFY_SITE_ID_PRIMARY: ${{ secrets.NETLIFY_SITE_ID }}
      NETLIFY_SITE_ID_FALLBACK: ${{ secrets.NETLIFY_SITE_ID_VILLALOSAPAMATES }}
    steps:
      - name: Verify secret sources without exposing values
        shell: bash
        run: |
          set -euo pipefail
          AUTH_TOKEN="${NETLIFY_AUTH_TOKEN_PRIMARY:-${NETLIFY_AUTH_TOKEN_FALLBACK:-}}"
          SITE_ID="${NETLIFY_SITE_ID_PRIMARY:-${NETLIFY_SITE_ID_FALLBACK:-}}"
          [ -n "$AUTH_TOKEN" ] || { echo 'NETLIFY_AUTH_SECRET_MISSING'; exit 1; }
          [ -n "$SITE_ID" ] || { echo 'NETLIFY_SITE_ID_MISSING'; exit 1; }
          [ -n "${AIRTABLE_TOKEN:-}" ] || { echo 'GITHUB_AIRTABLE_SECRET_MISSING'; exit 2; }
          echo "::add-mask::$AUTH_TOKEN"
          echo "::add-mask::$SITE_ID"
          echo "::add-mask::$AIRTABLE_TOKEN"
          echo "NETLIFY_AUTH_TOKEN=$AUTH_TOKEN" >> "$GITHUB_ENV"
          echo "NETLIFY_SITE_ID=$SITE_ID" >> "$GITHUB_ENV"
          echo 'SECRET_SOURCES_PRESENT'

      - name: Validate PAT against exact production base before any write
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /tmp/airtable-check.json --write-out '%{http_code}' --max-time 20 \
            -H "Authorization: Bearer $AIRTABLE_TOKEN" \
            'https://api.airtable.com/v0/app4nE4ReGRi2SuP2/Propietarios?maxRecords=1')"
          [ "$code" = "200" ] || { echo "AIRTABLE_PAT_INVALID_HTTP_$code"; exit 3; }
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('/tmp/airtable-check.json','utf8'));if(!Array.isArray(j.records))process.exit(1);console.log('AIRTABLE_PAT_VALID')"

      - name: Restore only AIRTABLE_API_TOKEN production value and mark it secret
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const token=process.env.NETLIFY_AUTH_TOKEN;
          const siteId=process.env.NETLIFY_SITE_ID;
          const airtableToken=process.env.AIRTABLE_TOKEN;
          const api='https://api.netlify.com/api/v1';
          const headers={Authorization:`Bearer ${token}`,'Content-Type':'application/json','User-Agent':'VLA-airtable-token-recovery'};
          async function parse(response,label){const body=await response.json().catch(()=>({}));if(!response.ok)throw new Error(`${label} HTTP ${response.status}`);return body}
          (async()=>{
            const site=await parse(await fetch(`${api}/sites/${encodeURIComponent(siteId)}`,{headers}),'site');
            const accountId=String(site.account_id||'').trim();
            if(!accountId)throw new Error('missing account_id');
            const endpoint=`${api}/accounts/${encodeURIComponent(accountId)}/env/AIRTABLE_API_TOKEN?site_id=${encodeURIComponent(siteId)}`;
            const current=await parse(await fetch(endpoint,{headers}),'read env');
            const scopes=(current.scopes||['builds','functions','runtime']).map(value=>String(value).replaceAll('_','-'));
            const values=(current.values||[]).filter(item=>item.context!=='production').map(item=>({value:String(item.value||''),context:String(item.context||'all'),...(item.context_parameter?{context_parameter:String(item.context_parameter)}:{})}));
            values.push({value:airtableToken,context:'production'});
            const payload={key:'AIRTABLE_API_TOKEN',scopes,values,is_secret:true};
            await parse(await fetch(endpoint,{method:'PUT',headers,body:JSON.stringify(payload)}),'restore env');
            const verified=await parse(await fetch(endpoint,{headers}),'verify env');
            const production=(verified.values||[]).find(item=>item.context==='production');
            if(verified.is_secret!==true||!production)throw new Error('restored variable metadata invalid');
            console.log('NETLIFY_AIRTABLE_TOKEN_RESTORED_SECRET');
          })().catch(error=>{console.error(String(error.message||error));process.exit(1)});
          NODE
