name: Patch prefill provider fallback

on:
  push:
    branches:
      - fix/prefill-provider-fallback-20260829

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/prefill-provider-fallback-20260829
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Patch resilient fallback and regression contract
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');

          const sourcePath='netlify/functions/payment-proof-prefill.js';
          let source=fs.readFileSync(sourcePath,'utf8');
          const sourceOld="catch(error){firstProxyError=error;lastError=error;if(['INVALID_ATTACHMENT','RATE_LIMIT','TIMEOUT','PROVIDER_UNAVAILABLE'].includes(errorCode(error)))throw error}";
          const sourceNew="catch(error){firstProxyError=error;lastError=error;if(['INVALID_ATTACHMENT','RATE_LIMIT'].includes(errorCode(error)))throw error}";
          if(!source.includes(sourceOld))throw new Error('No se encontró el bloque exacto de fallback esperado.');
          source=source.replace(sourceOld,sourceNew);
          fs.writeFileSync(sourcePath,source);

          const testPath='tests/payment-proof-prefill-resilience.test.js';
          let test=fs.readFileSync(testPath,'utf8');
          const testOld=`test('timeout del proxy en prelectura termina de inmediato sin gastar otro intento directo',async()=>{\n let discoveryCalls=0,directCalls=0;\n await assert.rejects(\n  ()=>prefill.analyzeWithFallback(baseArgs,{\n   localGeminiConfigured:()=>true,\n   discoverCompatibleModel:async()=>{discoveryCalls+=1;return{model:'gemini-primary'}},\n   analyzeDirect:async()=>{directCalls+=1;return{raw:VALID_RAW,model:'gemini-primary',provider:'direct'}},\n   analyzeViaProxy:async()=>{throw coded('TIMEOUT',504)}\n  }),\n  error=>error?.code==='TIMEOUT'&&error?.status===504\n );\n assert.equal(discoveryCalls,0);\n assert.equal(directCalls,0);\n});`;
          const testNew=`test('timeout del proxy cae a Gemini local y evita mandar al propietario a carga manual',async()=>{\n let discoveryCalls=0,directCalls=0;\n const result=await prefill.analyzeWithFallback(baseArgs,{\n  localGeminiConfigured:()=>true,\n  discoverCompatibleModel:async()=>{discoveryCalls+=1;return{model:'gemini-primary'}},\n  analyzeDirect:async()=>{directCalls+=1;return{raw:VALID_RAW,model:'gemini-primary',provider:'direct'}},\n  analyzeViaProxy:async()=>{throw coded('TIMEOUT',504)}\n });\n assert.equal(discoveryCalls,1);\n assert.equal(directCalls,1);\n assert.equal(result.provider,'direct');\n assert.equal(result.model,'gemini-primary');\n});`;
          if(!test.includes(testOld))throw new Error('No se encontró la prueba antigua del timeout.');
          test=test.replace(testOld,testNew);
          fs.writeFileSync(testPath,test);
          NODE
          rm .github/workflows/patch-prefill-provider-fallback.yml
      - run: npm test
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "VLA Automation"
          git config user.email "actions@users.noreply.github.com"
          git add netlify/functions/payment-proof-prefill.js tests/payment-proof-prefill-resilience.test.js .github/workflows/patch-prefill-provider-fallback.yml
          git commit -m "Hacer resiliente la prelectura ante caídas del proveedor"
          git push origin HEAD:fix/prefill-provider-fallback-20260829
