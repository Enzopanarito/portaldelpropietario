name: DIAG Gemini Fixed Models

on:
  pull_request:
    paths:
      - '.github/workflows/diag-gemini-fixed-models.yml'

permissions:
  contents: read

jobs:
  fixed-models:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      NETLIFY_AUTH_TOKEN_PRIMARY: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_AUTH_TOKEN_FALLBACK: ${{ secrets.NETLIFY_TOKEN }}
      NETLIFY_SITE_ID_PRIMARY: ${{ secrets.NETLIFY_SITE_ID }}
      NETLIFY_SITE_ID_FALLBACK: ${{ secrets.NETLIFY_SITE_ID_VILLALOSAPAMATES }}
      CURRENT_SHA: 4f91dbe0be402b02b14700124a24a1186b97e30a
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 2

      - name: Resolve Gemini key privately
        shell: bash
        run: |
          set -euo pipefail
          AUTH_TOKEN="${NETLIFY_AUTH_TOKEN_PRIMARY:-${NETLIFY_AUTH_TOKEN_FALLBACK:-}}"
          SITE_ID="${NETLIFY_SITE_ID_PRIMARY:-${NETLIFY_SITE_ID_FALLBACK:-}}"
          [ -n "$AUTH_TOKEN" ] && [ -n "$SITE_ID" ] || exit 1
          echo "::add-mask::$AUTH_TOKEN"
          site_json="$(curl --fail-with-body --silent --show-error -H "Authorization: Bearer $AUTH_TOKEN" -H 'User-Agent: VLA-Gemini-Fixed' "https://api.netlify.com/api/v1/sites/$SITE_ID")"
          account_id="$(printf '%s' "$site_json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(String(JSON.parse(s).account_id||'')))")"
          env_json="$(curl --fail-with-body --silent --show-error -H "Authorization: Bearer $AUTH_TOKEN" -H 'User-Agent: VLA-Gemini-Fixed' "https://api.netlify.com/api/v1/accounts/$account_id/env/GEMINI_API_KEY?site_id=$SITE_ID")"
          gemini_key="$(printf '%s' "$env_json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s),v=Array.isArray(j.values)?j.values:[];const p=v.find(x=>x.context==='production'&&String(x.value||'').trim());const a=v.find(x=>x.context==='all'&&String(x.value||'').trim());process.stdout.write(String((p||a||{}).value||''))})")"
          [ -n "$gemini_key" ] || exit 1
          echo "::add-mask::$gemini_key"
          echo "GEMINI_API_KEY=$gemini_key" >> "$GITHUB_ENV"

      - name: Materialize current engine
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$CURRENT_SHA"
          mkdir -p .diag-current
          git show "$CURRENT_SHA:netlify/functions/_shared/_payment_ai_gemini.js" > .diag-current/gemini.js
          echo "CURRENT_GEMINI_SHA=$(git rev-parse "$CURRENT_SHA:netlify/functions/_shared/_payment_ai_gemini.js")"
          echo "LEGACY_GEMINI_SHA=$(git rev-parse HEAD:netlify/functions/_shared/_payment_ai_gemini.js)"

      - name: Generate identical realistic JPEG
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          import os
          from PIL import Image,ImageDraw,ImageFont,ImageFilter
          w,h=1800,2400
          background=Image.effect_noise((w,h),24).convert('RGB').filter(ImageFilter.GaussianBlur(0.35))
          draw=ImageDraw.Draw(background); draw.rounded_rectangle((140,180,w-140,h-180),radius=44,fill=(248,248,246),outline=(210,210,205),width=5)
          font=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf',72); small=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf',60); bold=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf',82)
          lines=[('PAGO MOVIL COMPLETADO',bold),('Banco de Venezuela',font),('Monto: Bs. 12.345,67',font),('Fecha: 04/08/2026',font),('Hora: 10:30 AM',small),('Referencia: 987654321012',small),('Estado: COMPLETADO',font),('Receptor: Villa Los Apamates',small),('Telefono: 0412-0000000',small)]
          y=330
          for text,f in lines: draw.text((260,y),text,fill=(20,25,30),font=f); y+=185
          draw.text((260,h-410),'Comprobante de prueba CI - NO ES UN PAGO REAL',fill=(75,75,75),font=small)
          image=background.rotate(0.7,resample=Image.Resampling.BICUBIC,expand=False,fillcolor=(32,34,36)); image.save('matrix-proof.jpeg',format='JPEG',quality=94,optimize=True)
          print('MATRIX_JPEG_BYTES='+str(os.path.getsize('matrix-proof.jpeg')))
          PY

      - name: Run current and legacy engines over fixed production models
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const current=require('./.diag-current/gemini');
          const legacy=require('./netlify/functions/_shared/_payment_ai_gemini');
          const key=process.env.GEMINI_API_KEY;
          const proof={content:fs.readFileSync('matrix-proof.jpeg'),contentType:'image/jpeg'};
          const report={targetMode:''};
          const promptVersion='VLA_PAYMENT_PROOF_V2_2026-07-13';
          const models=['gemini-3.6-flash','gemini-3.5-flash','gemini-3.5-flash-lite'];
          function parsed(raw){let x={};try{x=JSON.parse(raw)}catch(_){}return{currency:x.currency||null,amount:x.amount??null,referencePresent:Boolean(x.reference),method:x.method||null,confidence:x.confidence??null}}
          async function run(engineName,engine,model){const t=Date.now();try{const runner=engine.createGeminiAnalysisRunner({apiKey:key,fetchFn:global.fetch,timeoutMs:30000,maxOutputTokens:2048});const raw=await runner({model,proof,report,promptVersion});const r={engine:engineName,model,ok:true,elapsedMs:Date.now()-t,...parsed(raw)};console.log(JSON.stringify(r));return r}catch(e){const r={engine:engineName,model,ok:false,elapsedMs:Date.now()-t,code:String(e?.code||''),status:Number(e?.status||0)||null,providerStatus:String(e?.providerStatus||'').slice(0,80),message:String(e?.message||'').slice(0,160)};console.log(JSON.stringify(r));return r}}
          (async()=>{const all=[];for(const model of models)all.push(await run('current',current,model));for(const model of models)all.push(await run('legacy',legacy,model));const usable=x=>x.ok&&x.currency==='VES'&&Math.abs(Number(x.amount||0)-12345.67)<=0.01&&x.referencePresent;const summary={currentUsable:all.filter(x=>x.engine==='current'&&usable(x)).map(x=>x.model),legacyUsable:all.filter(x=>x.engine==='legacy'&&usable(x)).map(x=>x.model)};console.log(JSON.stringify({FIXED_MATRIX_COMPLETE:true,summary}));if(!summary.legacyUsable.length)process.exit(2)})().catch(e=>{console.error(String(e));process.exit(1)});
          NODE
