name: Emergency Reconcile Access After August Close

on:
  push:
    branches:
      - emergency/august-close-recovery-20260901

permissions:
  contents: read

jobs:
  reconcile-access:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Netlify-signed production access reconciliation
        shell: bash
        run: |
          set -euo pipefail
          url='https://villalosapamates.netlify.app/.netlify/functions/access-reconciliation-scheduled'
          code="$(curl --silent --show-error --location --request POST \
            --header 'Content-Type: application/json' \
            --data '{"source":"august-close-recovery","force":true}' \
            --output /tmp/result.json --write-out '%{http_code}' --max-time 30 "$url")"
          cat /tmp/result.json
          case "$code" in
            200|202) ;;
            *) echo "ACCESS_RECONCILIATION_TRIGGER_FAILED HTTP $code"; exit 1;;
          esac
          sleep 20
          echo 'ACCESS_RECONCILIATION_TRIGGERED=1'
