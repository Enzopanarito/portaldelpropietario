name: Diagnose Owner Production

on:
  workflow_run:
    workflows: ["Deploy Netlify Production"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  diagnose-owner-production:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact production commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Wait for exact production release
        shell: bash
        run: |
          set -euo pipefail
          remote_release="${RUNNER_TEMP}/owner-diagnostic-release.json"
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --location --max-time 30 \
              "https://villalosapamates.netlify.app/release.json?diagnose=${GITHUB_RUN_ID}-${attempt}" \
              --output "$remote_release" \
              && node scripts/verify-release-contract.js release.json "$remote_release"; then
              echo "Exact production release detected."
              exit 0
            fi
            sleep 5
          done
          echo "Exact production release was not detected."
          exit 1

      - name: Install Chromium
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Diagnose live owner portal
        env:
          TARGET_URL: https://villalosapamates.netlify.app
        run: node tests/owner-production-browser.cjs

      - name: Upload diagnosis
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: owner-production-diagnostic
          path: |
            owner-production-result.json
            owner-production-error.txt
            owner-production.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish diagnostic status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
          TARGET_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          state=failure
          description='El diagnóstico exacto del portal propietario falló.'
          if [ "$RESULT" = "success" ]; then state=success; description='Portal, desglose y 15/15 saldos verificados en producción.'; fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state="$state" \
            -f context='Owner Portal Production Diagnostic' \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
