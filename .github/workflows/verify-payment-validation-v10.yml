name: Verify Payment Validation V10

on:
  push:
    branches:
      - agent/vla-payment-validation-lab-v10
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-v10:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: V10 duplicate / reject / review browser flow
        run: node tests/payment-validation-v10-browser.cjs
      - name: Legacy duplicate feedback compatibility
        run: node tests/payment-duplicate-feedback-browser.cjs
      - name: Proof-first V9 compatibility
        run: node tests/payment-report-proof-first-v9-browser.cjs
      - name: Owner payment browser compatibility
        run: node tests/owner-payment-report-browser.cjs
