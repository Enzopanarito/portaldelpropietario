name: Cancel Redundant Production Run

on:
  push:
    branches: [agent/payment-report-smart-v9]

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel redundant docs-only production run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: '31626842982'
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /tmp/cancel.out --write-out '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/cancel")"
          cat /tmp/cancel.out || true
          if [ "$code" != "202" ] && [ "$code" != "409" ]; then
            echo "Cancel request failed: HTTP $code"
            exit 1
          fi
          echo "REDUNDANT_PRODUCTION_RUN_CANCEL_REQUESTED run=$RUN_ID http=$code"
