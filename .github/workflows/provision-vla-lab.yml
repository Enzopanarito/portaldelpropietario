name: Provision VLA LAB

on:
  push:
    branches:
      - agent/vla-payment-validation-lab-v10
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provision-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NETLIFY_AUTH_TOKEN_PRIMARY: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_AUTH_TOKEN_FALLBACK: ${{ secrets.NETLIFY_TOKEN }}
      PROD_SITE_ID: 74f4f122-352c-4a3b-aa6f-5937ab99f8d3
      LAB_NAME: vla-lab-enzopanarito-74f4f122
      LAB_STAGING_BASE_ID: appZhq8nVZ7lZ2k6K
    steps:
      - name: Checkout LAB branch
        uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install repository dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Resolve Netlify token without exposing it
        shell: bash
        run: |
          set -euo pipefail
          token="${NETLIFY_AUTH_TOKEN_PRIMARY:-${NETLIFY_AUTH_TOKEN_FALLBACK:-}}"
          [ -n "$token" ] || { echo 'Falta token Netlify; no se creó ni modificó ningún sitio.'; exit 1; }
          echo "::add-mask::$token"
          echo "NETLIFY_AUTH_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Install pinned Netlify CLI
        run: npm install --global netlify-cli@27.0.0 --no-audit --no-fund

      - name: Resolve or create dedicated LAB site
        id: labsite
        shell: bash
        run: |
          set -euo pipefail
          search_json="$(netlify sites:search "$LAB_NAME" --json --auth "$NETLIFY_AUTH_TOKEN" 2>/dev/null || printf '[]')"
          lab_id="$(printf '%s' "$search_json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{let j=[];try{j=JSON.parse(s)}catch{};if(!Array.isArray(j))j=j.sites||j.items||[];const n=process.env.LAB_NAME;const hit=j.find(x=>x&&x.name===n);process.stdout.write(String(hit?.id||hit?.site_id||''))})")"
          if [ -z "$lab_id" ]; then
            create_json="$(netlify sites:create --name "$LAB_NAME" --account-slug enzopanarito --disable-linking --json --auth "$NETLIFY_AUTH_TOKEN")"
            lab_id="$(printf '%s' "$create_json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);process.stdout.write(String(j.id||j.site_id||j.site?.id||''))})")"
          fi
          [ -n "$lab_id" ] || { echo 'No se pudo resolver el ID del sitio LAB.'; exit 1; }
          echo "lab_id=$lab_id" >> "$GITHUB_OUTPUT"
          echo "lab_url=https://${LAB_NAME}.netlify.app" >> "$GITHUB_OUTPUT"
          echo "VLA LAB site: $LAB_NAME"

      - name: Clone protected environment internally inside Netlify
        shell: bash
        env:
          LAB_ID: ${{ steps.labsite.outputs.lab_id }}
        run: |
          set -euo pipefail
          if ! netlify env:clone --from "$PROD_SITE_ID" --to "$LAB_ID" --force --auth "$NETLIFY_AUTH_TOKEN" >/dev/null 2>&1; then
            echo 'Netlify no pudo clonar internamente las variables protegidas. LAB no será desplegado.'
            exit 1
          fi
          echo 'Variables clonadas internamente sin imprimir valores.'

      - name: Override every dangerous LAB destination
        shell: bash
        env:
          LAB_ID: ${{ steps.labsite.outputs.lab_id }}
        run: |
          set -euo pipefail
          setv(){ netlify env:set "$1" "$2" --context production --site "$LAB_ID" --auth "$NETLIFY_AUTH_TOKEN" --force >/dev/null; }
          sets(){ netlify env:set "$1" "$2" --context production --site "$LAB_ID" --auth "$NETLIFY_AUTH_TOKEN" --force --secret >/dev/null; }
          setv AIRTABLE_BASE_ID "$LAB_STAGING_BASE_ID"
          setv VLA_DATA_ENVIRONMENT staging
          setv VLA_LAB_MODE true
          setv PUBLIC_BLOB_CACHE_ENABLED false
          setv PUBLIC_BLOB_CACHE_MAX_AGE_MS 120000
          setv VLA_WHATSAPP_CONTROL_URL 'disabled://vla-lab'
          sets VLA_WHATSAPP_CONTROL_SECRET 'VLA_LAB_DISABLED'
          setv MKJ_BASE_URL 'http://127.0.0.1:9'
          setv MKJ_ORG_ID '0'
          setv MKJ_ADMIN_EMAIL 'vla-lab-disabled@invalid.invalid'
          sets MKJ_ADMIN_PASSWORD 'VLA_LAB_DISABLED'
          setv SMTP_HOST '127.0.0.1'
          setv SMTP_PORT '9'
          setv SMTP_USER 'vla-lab-disabled@invalid.invalid'
          sets SMTP_SECRET 'VLA_LAB_DISABLED'
          setv MAIL_FROM 'vla-lab-disabled@invalid.invalid'
          echo 'Destinos externos del LAB neutralizados.'

      - name: Force production context of the LAB site to staging
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const file='netlify.toml';
          let text=fs.readFileSync(file,'utf8');
          const replacement=`[context.production.environment]
  PUBLIC_BLOB_CACHE_ENABLED = "false"
  PUBLIC_BLOB_CACHE_MAX_AGE_MS = "120000"
  VLA_DATA_ENVIRONMENT = "staging"
  VLA_LAB_MODE = "true"
  AIRTABLE_BASE_ID = "appZhq8nVZ7lZ2k6K"
  VLA_WHATSAPP_CONTROL_URL = "disabled://vla-lab"
  VLA_WHATSAPP_CONTROL_SECRET = "VLA_LAB_DISABLED"
  MKJ_BASE_URL = "http://127.0.0.1:9"
  MKJ_ORG_ID = "0"
  MKJ_ADMIN_EMAIL = "vla-lab-disabled@invalid.invalid"
  MKJ_ADMIN_PASSWORD = "VLA_LAB_DISABLED"
  SMTP_HOST = "127.0.0.1"
  SMTP_PORT = "9"
  SMTP_USER = "vla-lab-disabled@invalid.invalid"
  SMTP_SECRET = "VLA_LAB_DISABLED"
  MAIL_FROM = "vla-lab-disabled@invalid.invalid"
`;
          const re=/\[context\.production\.environment\][\s\S]*?(?=\n\[context\.|\n\[functions|\n#|$)/;
          if(!re.test(text))throw new Error('No se encontró context.production.environment.');
          text=text.replace(re,replacement.trimEnd());
          fs.writeFileSync(file,text);
          NODE
          if grep -A25 '^\[context.production.environment\]' netlify.toml | grep -q 'VLA_DATA_ENVIRONMENT = "production"'; then
            echo 'El contexto LAB conserva production; despliegue bloqueado.'
            exit 1
          fi

      - name: Re-run LAB isolation and full payment gates
        env:
          CONTEXT: dev
          VLA_LAB_MODE: 'true'
          VLA_DATA_ENVIRONMENT: staging
          AIRTABLE_BASE_ID: appZhq8nVZ7lZ2k6K
        run: |
          node ops/vla-lab/preflight.js
          node tests/payment-recipient-policy-v10.test.js
          node tests/payment-duplicate-core.test.js
          node tests/payment-prefill-attestation.test.js
          node tests/payment-proof-prefill-v10-decision.test.js
          node tests/payment-v10-routing-and-lab-guard.test.js

      - name: Build exact LAB artifact
        env:
          CONTEXT: production
          VLA_LAB_MODE: 'true'
          VLA_DATA_ENVIRONMENT: staging
          AIRTABLE_BASE_ID: appZhq8nVZ7lZ2k6K
          PUBLIC_BLOB_CACHE_ENABLED: 'false'
          PUBLIC_BLOB_CACHE_MAX_AGE_MS: '120000'
        run: npm run build:public

      - name: Deploy only to dedicated LAB site
        id: deploy
        shell: bash
        env:
          LAB_ID: ${{ steps.labsite.outputs.lab_id }}
        run: |
          set -euo pipefail
          deploy_json="$(netlify deploy --prod --context production --no-build --dir dist --functions netlify/functions --site "$LAB_ID" --auth "$NETLIFY_AUTH_TOKEN" --skip-functions-cache --message "VLA LAB ${GITHUB_SHA}" --json)"
          deploy_url="$(printf '%s' "$deploy_json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);process.stdout.write(String(j.url||j.deploy_url||j.deploy_ssl_url||''))})")"
          [ -n "$deploy_url" ] || deploy_url="https://${LAB_NAME}.netlify.app"
          echo "deploy_url=$deploy_url" >> "$GITHUB_OUTPUT"
          echo "LAB deployed: $deploy_url"

      - name: Verify LAB runtime secrets and staging isolation without exposing values
        shell: bash
        env:
          LAB_URL: ${{ steps.deploy.outputs.deploy_url }}
        run: |
          set -euo pipefail
          ready=''
          for _ in $(seq 1 24); do
            if ready="$(curl --fail-with-body --silent --show-error "$LAB_URL/.netlify/functions/lab-readiness" 2>/dev/null)"; then break; fi
            sleep 5
          done
          [ -n "$ready" ] || { echo 'LAB no respondió readiness.'; exit 1; }
          printf '%s' "$ready" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);const ok=j.ready===true&&j.lab===true&&j.stagingBase===true&&j.airtableTokenAvailable===true&&j.geminiKeyAvailable===true&&j.airtableReachable===true&&j.houses===15&&j.authorizedRecipients===6&&j.externalWritesBlocked===true&&j.productionBaseAccessible===false;if(!ok){console.error(JSON.stringify(j));process.exit(1)}console.log('VLA_LAB_READINESS_OK 15/15 houses · 6/6 recipients · Gemini available · production blocked')})"
          html="$(curl --fail-with-body --silent --show-error "$LAB_URL/")"
          printf '%s' "$html" | grep -q 'VLA LAB' || { echo 'Falta banner visible VLA LAB.'; exit 1; }

      - name: Publish LAB coordinates
        shell: bash
        env:
          LAB_ID: ${{ steps.labsite.outputs.lab_id }}
          LAB_URL: ${{ steps.deploy.outputs.deploy_url }}
        run: |
          set -euo pipefail
          echo '### 🧪 VLA LAB READY' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: $LAB_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Site ID: $LAB_ID" >> "$GITHUB_STEP_SUMMARY"
          echo '- Data: Airtable STAGING, 15 casas ficticias' >> "$GITHUB_STEP_SUMMARY"
          echo '- Receptores autorizados LAB: 6/6' >> "$GITHUB_STEP_SUMMARY"
          echo '- Gemini: disponible (valor secreto no expuesto)' >> "$GITHUB_STEP_SUMMARY"
          echo '- MKJ / WhatsApp / SMTP reales: bloqueados' >> "$GITHUB_STEP_SUMMARY"
          echo '- Producción VLA: NO desplegada' >> "$GITHUB_STEP_SUMMARY"
