name: Provision VLA LAB (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Explain current infrastructure gate
        run: |
          echo 'The dedicated-site LAB path is manual-only because the Netlify account currently reports its site creation limit reached.'
          echo 'Prefer ops/vla-lab/INICIAR_VLA_LAB.command on the Mac mini.'

      - name: Checkout LAB branch
        uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install repository dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install pinned Netlify CLI
        run: npm install --global netlify-cli@27.0.0 --no-audit --no-fund

      - name: Provision isolated navigable LAB
        env:
          NETLIFY_AUTH_TOKEN_PRIMARY: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_AUTH_TOKEN_FALLBACK: ${{ secrets.NETLIFY_TOKEN }}
        run: bash ops/vla-lab/provision-netlify-lab.sh
