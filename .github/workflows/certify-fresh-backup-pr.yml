name: Certify Fresh Production Backup PR

on:
  pull_request:
    branches: [main]

permissions:
  actions: write
  contents: read

jobs:
  fresh-backup:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/vla-autopay-resilience-20260822'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      OFFICIAL_BACKUP_WORKFLOW: backup-vla-production.yml
    steps:
      - name: Dispatch official production backup on main
        id: dispatch
        shell: bash
        run: |
          set -euo pipefail
          marker="$(date -u +%s)"
          response_code="$(curl --silent --show-error --output /tmp/dispatch-response.txt --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${OFFICIAL_BACKUP_WORKFLOW}/dispatches" \
            --data '{"ref":"main"}')"
          if [ "$response_code" != '204' ]; then
            echo "No se pudo disparar el workflow oficial de backup (HTTP $response_code)."
            cat /tmp/dispatch-response.txt 2>/dev/null || true
            exit 1
          fi
          rm -f /tmp/dispatch-response.txt
          echo "marker=$marker" >> "$GITHUB_OUTPUT"
          echo 'OFFICIAL_BACKUP_DISPATCH_OK ref=main credentials=untouched'

      - name: Resolve dispatched official backup run
        id: resolve
        env:
          MARKER: ${{ steps.dispatch.outputs.marker }}
        shell: bash
        run: |
          set -euo pipefail
          run_id=''
          for attempt in $(seq 1 24); do
            runs="$(curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${OFFICIAL_BACKUP_WORKFLOW}/runs?event=workflow_dispatch&branch=main&per_page=20")"
            run_id="$(printf '%s' "$runs" | jq -r --argjson marker "$MARKER" '[.workflow_runs[] | select(.event=="workflow_dispatch") | select((.created_at|fromdateiso8601) >= ($marker-10))] | sort_by(.created_at) | reverse | .[0].id // empty')"
            [ -n "$run_id" ] && break
            sleep 5
          done
          [ -n "$run_id" ] || { echo 'No apareció la ejecución oficial de backup disparada.'; exit 1; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "OFFICIAL_BACKUP_RUN_RESOLVED id=$run_id"

      - name: Require official backup and restore rehearsal PASS
        env:
          BACKUP_RUN_ID: ${{ steps.resolve.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          conclusion=''
          for attempt in $(seq 1 90); do
            run="$(curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${BACKUP_RUN_ID}")"
            status="$(printf '%s' "$run" | jq -r '.status // ""')"
            conclusion="$(printf '%s' "$run" | jq -r '.conclusion // ""')"
            if [ "$status" = 'completed' ]; then break; fi
            sleep 10
          done
          [ "$conclusion" = 'success' ] || { echo "El backup oficial no terminó PASS (conclusion=${conclusion:-unknown})."; exit 1; }

          artifacts="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${BACKUP_RUN_ID}/artifacts?per_page=100")"
          artifact_count="$(printf '%s' "$artifacts" | jq --arg prefix "vla-airtable-backup-${BACKUP_RUN_ID}" '[.artifacts[] | select(.expired==false) | select(.name==$prefix)] | length')"
          [ "$artifact_count" = '1' ] || { echo "No existe exactamente un artefacto cifrado vigente para el backup oficial (count=$artifact_count)."; exit 1; }
          echo "VLA_OFFICIAL_FRESH_BACKUP_CERTIFIED run=${BACKUP_RUN_ID} ref=main result=PASS encryptedArtifact=1 restoreRehearsal=PASS credentials=untouched"
