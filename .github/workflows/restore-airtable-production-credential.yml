name: Restore Airtable production credential

on:
  push:
    branches:
      - fix/restore-airtable-production-credential-20260803
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  restore:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NETLIFY_SITE_ID: 74f4f122-352c-4a3b-aa6f-5937ab99f8d3
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN || secrets.NETLIFY_TOKEN }}
      AIRTABLE_API_TOKEN: ${{ secrets.AIRTABLE_API_TOKEN || secrets.AIRTABLE_TOKEN || secrets.AIRTABLE_PAT || secrets.AIRTABLE_API_KEY }}
    steps:
      - name: Verify required secret availability
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${NETLIFY_AUTH_TOKEN:-}" ]; then
            echo "::error::No Netlify authentication secret is configured in GitHub Actions."
            missing=1
          fi
          if [ -z "${AIRTABLE_API_TOKEN:-}" ]; then
            echo "::error::No Airtable personal access token is configured in GitHub Actions."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Restore production Airtable credential in Netlify
        shell: bash
        run: |
          set -euo pipefail
          npx --yes netlify-cli@latest env:set AIRTABLE_API_TOKEN "$AIRTABLE_API_TOKEN" \
            --site "$NETLIFY_SITE_ID" \
            --auth "$NETLIFY_AUTH_TOKEN" \
            --context production \
            --scope functions runtime \
            --secret \
            --force

      - name: Confirm restoration without exposing the credential
        shell: bash
        run: |
          set -euo pipefail
          echo "AIRTABLE_API_TOKEN was submitted to Netlify for the production Functions and Runtime scopes."
