name: Publicar reparación de reportes de pago

on:
  push:
    branches: [main]
    paths:
      - '.github/payment-fix-deploy-trigger.txt'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Construir y publicar en producción
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: 74f4f122-352c-4a3b-aa6f-5937ab99f8d3
        run: |
          test -n "$NETLIFY_AUTH_TOKEN"
          npx --yes netlify-cli@latest deploy --build --prod --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN" --message "Reparación comprobantes smart-v6-submit-r2"
