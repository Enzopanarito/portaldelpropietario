name: Fix Zelle date guard 20260828

on:
  push:
    branches:
      - fix/payment-prefill-quality-fallback-20260828
    paths:
      - .github/workflows/fix-zelle-date-guard-20260828.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Patch exact guard and regression
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p=Path('netlify/functions/_shared/_payment_deterministic_arbiter.js')
          text=p.read_text()
          old="const transactionDate=dateMs(analysis.transaction_date),dateOk=Number.isFinite(transactionDate)&&transactionDate<=now.getTime()+24*60*60*1000,zelleDateReview=!dateOk&&method==='ZELLE'&&zelleCoreVisible;"
          new="const transactionDate=dateMs(analysis.transaction_date),dateOk=Number.isFinite(transactionDate)&&transactionDate<=now.getTime()+24*60*60*1000,zelleDateReview=!clean(analysis.transaction_date)&&method==='ZELLE'&&zelleCoreVisible;"
          if text.count(old)!=1: raise SystemExit(f'arbiter date guard match count={text.count(old)}')
          p.write_text(text.replace(old,new,1))

          p=Path('tests/payment-deterministic-arbiter.test.js')
          text=p.read_text()
          old="const noExtractedDate=arbiter.evaluatePaymentReport(base({analysis:{...base().analysis,transaction_date:null},config:{minimumConfidence:0.85,automaticApprovalEnabled:true,minimumAutomaticConfidence:0.97}}));assert.strictEqual(noExtractedDate.resultValidation,'Fecha inválida');assertNoAction(noExtractedDate);"
          new="const noExtractedDate=arbiter.evaluatePaymentReport(base({analysis:{...base().analysis,transaction_date:null},config:{minimumConfidence:0.85,automaticApprovalEnabled:true,minimumAutomaticConfidence:0.97}}));assert.strictEqual(noExtractedDate.processingState,'Pendiente de administrador');assert(noExtractedDate.reasons.includes('ZELLE_DATE_NOT_VISIBLE'));assertNoAction(noExtractedDate);"
          if text.count(old)!=1: raise SystemExit(f'legacy date regression match count={text.count(old)}')
          p.write_text(text.replace(old,new,1))
          PY
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Full test suite
        run: npm test
      - name: Remove workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-zelle-date-guard-20260828.yml
          git config user.name 'vla-repair-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Distinguir fecha Zelle ausente de fecha Zelle inválida'
          git push origin HEAD:fix/payment-prefill-quality-fallback-20260828
